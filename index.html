<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>PMA Loan Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#fffafd;--panel:#ffffff;--panel2:#f6effc;--line:#eadcf3;--text:#3a2f4d;--muted:#7c6f92;
  --gold:#a1327c;--gold-fill:#ffb6d3;--on-gold:#3b1633;--good:#1f7a4f;--warn:#a8650a;--bad:#c2334d;--ov:rgba(58,47,77,.45);
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;margin:0;letter-spacing:-.01em}
h1{font-size:19px}
h2{font-size:18px}
h3{font-size:18px;margin-bottom:12px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold-fill);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:10px 14px 2px}
.logo{width:34px;height:24px;border-radius:5px;background:linear-gradient(135deg,#f3da85,#b48b1a);position:relative;flex:none}
.logo::after{content:"";position:absolute;left:5px;top:7px;width:9px;height:7px;border-radius:2px;background:rgba(0,0,0,.35)}
.brand p{margin:0;font-size:12.5px;color:var(--muted)}
.sync{margin-left:auto;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.sync.ok{color:var(--good)}
.sync.bad{color:var(--bad)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 12px 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;color:var(--muted);padding:9px 15px;border-radius:9px;font-weight:600;font-size:14px;cursor:pointer;min-height:40px}
.tab[aria-current="true"]{background:var(--gold-fill);color:var(--on-gold)}

main{max-width:1280px;margin:0 auto;padding:14px 12px 70px}
.sub{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 12px;font-weight:600;font-size:13.5px;cursor:pointer;min-height:36px}
.chip[aria-current="true"]{border-color:var(--gold-fill);color:var(--gold);background:transparent;box-shadow:inset 0 0 0 1px var(--gold-fill)}

.fbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.fbar label{flex:1 1 110px;font-size:12.5px;color:var(--muted)}
select,input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel);min-height:42px;font-size:16px}
select:disabled{opacity:.5}
.fbar select{margin-top:3px}

.sec{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:20px 0 8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer;min-height:40px}
.btn.gold{background:var(--gold-fill);color:var(--on-gold);border-color:transparent}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px}
.btn.del{color:var(--bad)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:6px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 13px}
.stat small{display:block;color:var(--muted);font-size:12.5px}
.stat b{display:block;font:700 19px "Bricolage Grotesque",Figtree,sans-serif;margin-top:2px;word-break:break-word}
.stat.gold{background:linear-gradient(135deg,#eccb60,#b48b1a);color:var(--on-gold);border-color:transparent}
.stat.gold small{color:rgba(27,21,0,.75)}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:720px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:9px 10px;background:var(--panel);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;background:var(--panel);border-top:1px solid var(--line);border-bottom:0}
.n{text-align:right}
td.empty,p.empty{color:var(--muted);white-space:normal;padding:16px 12px}
.acts{display:flex;gap:6px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:600;border:1px solid currentColor;background:transparent;cursor:default}
button.pill{cursor:pointer}
.p-New{color:var(--gold)}.p-Pending{color:var(--warn)}.p-Done,.p-Paid,.p-Released,.p-Received{color:var(--good)}
.p-Waiting{color:var(--warn)}

.ledger{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ledger div{display:flex;justify-content:space-between;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line)}
.ledger div:last-child{border-bottom:0}
.ledger .tot{font-weight:700;background:var(--panel2)}
.ledger .share{background:linear-gradient(135deg,#eccb60,#b48b1a);color:var(--on-gold);font:700 18px "Bricolage Grotesque",Figtree,sans-serif}
.ledger .neg span:last-child{color:var(--bad)}

.podium{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.medal{border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.medal small{font-size:13px;font-weight:600}
.medal b{font:700 18px "Bricolage Grotesque",Figtree,sans-serif;overflow-wrap:anywhere}
.medal span{font-size:16px;font-weight:600}
.medal em{font-style:normal;font-size:12px;opacity:.8}
.m1{background:linear-gradient(135deg,#f0d36a,#b48b1a);color:#1b1500}
.m2{background:linear-gradient(135deg,#dfe1e4,#8f959c);color:#15171a}

.bars{display:grid;gap:10px}
.bars .lbl{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:3px;gap:8px}
.bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold-fill)}

details{border:1px solid var(--line);border-radius:12px;background:var(--panel);margin:12px 0}
summary{padding:12px 14px;cursor:pointer;font-weight:600}
.dbody{padding:0 14px 14px}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:10px}
.fld{display:block;margin-bottom:12px}
.fld>span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.mini{width:96px;min-height:36px;padding:5px 8px}
.chk{display:flex;align-items:center;gap:10px;margin:8px 0}
.chk input{width:22px;height:22px;min-height:0;padding:0;flex:none}
.hint{font-size:13px;color:var(--muted);margin:6px 0}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}

.ov{position:fixed;inset:0;background:var(--ov);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--bg);border:1px solid var(--line);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.btns{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.merr{color:var(--bad);font-size:13.5px;margin:4px 0;min-height:0}
@media (min-width:640px){.ov{align-items:center}.sheet{border-radius:16px}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;font-size:14px;max-width:90%}
.toast.bad{background:var(--bad);color:#fff}
.lockbox{max-width:320px;margin:12vh auto 0;text-align:center}
.lockbox .logo{width:54px;height:38px;margin:0 auto 14px}
.lockbox .logo::after{left:8px;top:11px;width:14px;height:10px}
.lockbox input{text-align:center;letter-spacing:.4em;font-size:22px;margin:12px 0 4px}
.lockbox .btn{width:100%}
.locked #nav,.locked #lockbtn{display:none}
button.sync{background:transparent;cursor:pointer;margin-left:6px}
#lockbtn[hidden]{display:none}
.expbar{display:flex;justify-content:flex-end;margin:-2px 0 10px}
textarea{width:100%;min-height:200px;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--text);font:13px/1.4 ui-monospace,Menlo,Consolas,monospace}
/* pastel look */
@media (max-width:640px){
  .tw.stack table{min-width:0!important}
  .tw.stack thead{display:none}
  .tw.stack tr{display:block;padding:10px 14px;border-bottom:1px solid var(--line)}
  .tw.stack tbody tr:last-child{border-bottom:0}
  .tw.stack td{display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;padding:3px 0;white-space:normal}
  .tw.stack td::before{content:attr(data-l);color:var(--muted);font-size:13px}
  .tw.stack td[data-l="Bank name"]{font-weight:700}
  .tw.stack td[data-l="Bank name"]::before{content:none}
  .tw.stack td:empty{display:none}
  .tw.stack td.empty{display:block}
  .tw.stack td.empty::before{content:none}
  .tw.stack tfoot tr{border-bottom:0;background:#f7f0ff}
  .tw.stack tfoot td{background:transparent;border:0}
}
.dt{width:150px;min-height:36px;padding:5px 8px}
.rc{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.tw.stack .rc{flex-direction:row;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:8px}
td.wr{white-space:normal;min-width:100px}
.warn{background:#fff6dd;border:1px solid #f0d58a;color:#6b4a00;border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.ac{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.pay{width:112px;min-height:34px;padding:4px 8px;font-weight:700;font-size:14px}
.pay.wide{width:190px}
.pay.pd{color:var(--good);border-color:#8bd6b0;background:#effaf4}
.pay.up{color:var(--warn);border-color:#f0c98a;background:#fff8ec}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
.d-ok{background:#3fbf87}.d-no{background:#ffb84d}
select,input,textarea{color:var(--text)}
.brand>div{min-width:0}
.brand h1{white-space:nowrap}
.brand p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{font-size:11.5px}
html{background:#fffafd}
body{background:transparent}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(440px 340px at 6% 4%,rgba(255,190,220,.85),transparent 70%),
    radial-gradient(480px 380px at 98% 10%,rgba(188,225,255,.9),transparent 70%),
    radial-gradient(540px 440px at 84% 98%,rgba(224,206,255,.9),transparent 70%),
    radial-gradient(440px 340px at 2% 94%,rgba(255,240,178,.9),transparent 70%),
    #fffafd}
.top{background:rgba(255,250,253,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.tab[aria-current="true"],.btn.gold{background:linear-gradient(135deg,#ffb3d1,#cdbbff);color:var(--on-gold)}
.chip[aria-current="true"]{border-color:#ff9cc6;color:var(--gold);background:#fff0f7;box-shadow:none}
:focus-visible{outline-color:#8d6be0}
.bar i{background:linear-gradient(90deg,#ff9cc6,#b9a4ff)}
th,tfoot td{background:#f7f0ff}
.tw,.ledger,details{background:rgba(255,255,255,.92)}
.stats .stat:nth-child(4n+1){background:#ffe8f1}
.stats .stat:nth-child(4n+2){background:#e3f3ff}
.stats .stat:nth-child(4n+3){background:#efe6ff}
.stats .stat:nth-child(4n+4){background:#fff6d3}
.stats .stat.gold{background:linear-gradient(135deg,#ffbfd9,#cdbcff);color:#3b1633;border-color:transparent}
.stats .stat.gold small{color:rgba(59,22,51,.75)}
.ledger .share{background:linear-gradient(135deg,#ffc3dc,#cfe6ff);color:#3b1633}
.m1{background:linear-gradient(135deg,#ffc9df,#fff0b8);color:#3b1633}
.m2{background:linear-gradient(135deg,#cfe8ff,#e2d4ff);color:#2b2350}
.p-New{color:#7a4fd0}
.ico{width:50px;height:34px;flex:none;animation:bob 5s ease-in-out infinite}
.art{display:block;width:230px;max-width:80%;height:auto;margin:0 auto 4px;animation:bob 6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.sheet{background:#fffafd}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="gCard" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9ec8"/><stop offset=".55" stop-color="#c7a8ff"/><stop offset="1" stop-color="#9fd4ff"/></linearGradient>
    <linearGradient id="gChip" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3ae"/><stop offset="1" stop-color="#ffd25e"/></linearGradient>
    <linearGradient id="gTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff6c4"/><stop offset="1" stop-color="#ffd76a"/></linearGradient>
    <linearGradient id="gSide" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffcf5a"/><stop offset="1" stop-color="#eda42e"/></linearGradient>
    <linearGradient id="gShine" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>

      <ellipse cx="120" cy="140" rx="92" ry="8" fill="#7a5cc4" opacity=".14"/>
      <path d="M40 22l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#fff" opacity=".95"/>
      <path d="M205 20l2.4 6 6 2.4-6 2.4-2.4 6-2.4-6-6-2.4 6-2.4z" fill="#ffd25e"/>
      <path d="M118 12l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#ff9ec8"/>
      <circle cx="222" cy="70" r="4" fill="#bfe3ff"/><circle cx="14" cy="88" r="5" fill="#ffe08a"/><circle cx="100" cy="6" r="3" fill="#d9c6ff"/>
      <g transform="translate(20 34) rotate(-13 62 40)">
        <rect x="0" y="0" width="124" height="80" rx="13" fill="url(#gCard)"/>
        <rect x="0" y="16" width="124" height="12" fill="#fff" opacity=".28"/>

        <rect x="14" y="65" width="52" height="5" rx="2.5" fill="#fff" opacity=".75"/>
        <rect x="72" y="65" width="26" height="5" rx="2.5" fill="#fff" opacity=".55"/>
        <path d="M0 13Q0 0 13 0H92Q44 30 0 52z" fill="url(#gShine)" opacity=".55"/>
        <rect x=".5" y=".5" width="123" height="79" rx="12.5" fill="none" stroke="#fff" stroke-opacity=".7"/>
      </g>
      <g>
        <path d="M148 120v10a34 11 0 0 0 68 0v-10z" fill="url(#gSide)"/><ellipse cx="182" cy="120" rx="34" ry="11" fill="url(#gTop)"/>
        <path d="M148 106v10a34 11 0 0 0 68 0v-10z" fill="url(#gSide)"/><ellipse cx="182" cy="106" rx="34" ry="11" fill="url(#gTop)"/>
        <path d="M148 92v10a34 11 0 0 0 68 0v-10z" fill="url(#gSide)"/><ellipse cx="182" cy="92" rx="34" ry="11" fill="url(#gTop)"/>
        <ellipse cx="182" cy="92" rx="25" ry="7.6" fill="none" stroke="#e8a92f" stroke-opacity=".6"/>
        <text x="182" y="96.6" text-anchor="middle" font-size="15" font-weight="700" fill="#b5830b" font-family="Figtree,system-ui,sans-serif">₱</text>
      </g>
    </symbol>
  </defs>
</svg>
<header class="top">
  <div class="brand">
    <svg class="ico" viewBox="0 0 48 32" aria-hidden="true"><use href="#ico"/></svg>
    <div><h1>Loan tracker</h1><p>ORC and DMS partner agencies</p></div>
    <span id="sync" class="sync">Locked</span>
    <button id="lockbtn" class="sync" data-act="lock" hidden>Lock</button>
  </div>
  <nav id="nav" class="tabs" aria-label="Sections"></nav>
</header>
<main id="app"></main>
<div id="modal"></div>
<div id="toast"></div>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
var COLS=['approvals_orc','approvals_dms','leads_orc','leads_dms','loanleads_orc','loanleads_dms','income','expenses','attendance','turnins'];
var AG={orc:'ORC',dms:'DMS'};
var MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
var M3=MN.map(function(m){return m.slice(0,3)});
var WK=['1 to 7','8 to 14','15 to 21','22 to 28','29 to end'];
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var pad=function(n){return String(n).padStart(2,'0')};
var today=function(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)};
var num=function(v){var n=parseFloat(String(v==null?'':v).replace(/[₱,\s]/g,''));return isFinite(n)?n:0};
var fmt=function(n){return (+n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2})};
var peso=function(n){return '₱'+fmt(n)};
var dstr=function(s){return s?M3[+s.slice(5,7)-1]+' '+(+s.slice(8,10))+', '+s.slice(0,4):''};
var sum=function(a,f){return a.reduce(function(t,x){return t+f(x)},0)};
var byId=function(a,id){return (a||[]).find(function(x){return x.id===id})};
var getPath=function(o,p){return p.split('.').reduce(function(x,k){return x&&x[k]},o)};
var setPath=function(o,p,v){var ks=p.split('.');var l=ks.pop();var t=ks.reduce(function(x,k){return x[k]},o);t[l]=v};
var dateDesc=function(a,b){return (b.date||'').localeCompare(a.date||'')||(b.ts||0)-(a.ts||0)};
var sig=function(l){return JSON.stringify((l||[]).slice().sort(function(a,b){return a.id<b.id?-1:1}))};

/* ---------- state ---------- */
function emptyCfg(){return{loanAgents:[],leadsAgents:[],banks:[],loanTypes:[],incentives:[],incomeCats:[],expenseCats:[],
  tax:{orc:10,dms1:10,dms2:2},leadsRate:{orc:1.5,dms:1.5},loanLeads:{rate:1,tax1:10,tax2:2},includeLeads:false,cashBond:100,recv:{}}}
function mergeCfg(d){
  var e=emptyCfg();var o=Object.assign(e,d||{});
  o.tax=Object.assign(emptyCfg().tax,(d&&d.tax)||{});
  o.leadsRate=Object.assign(emptyCfg().leadsRate,(d&&d.leadsRate)||{});
  o.loanLeads=Object.assign(emptyCfg().loanLeads,(d&&d.loanLeads)||{});
  if(!o.recv||typeof o.recv!=='object'||Array.isArray(o.recv))o.recv={};
  ['loanAgents','leadsAgents','banks','loanTypes','incentives','incomeCats','expenseCats'].forEach(function(k){if(!Array.isArray(o[k]))o[k]=[]});
  return o;
}
var now=new Date();
var F={year:Math.max(2026,now.getFullYear()),month:now.getMonth()+1,week:0};
var S={view:'orc',sub:{orc:'app',dms:'app'},agentSel:{orc:'',dms:''},fAgent:'',fStatus:'',
  att:{year:F.year,month:F.month,half:1},cfg:emptyCfg(),data:{},open:{},loaded:false,ready:{},unlocked:false,pin:''};
COLS.forEach(function(c){S.data[c]=[]});

/* ---------- period filter ---------- */
function inPeriod(ds){
  if(!ds)return false;
  var y=+ds.slice(0,4),m=+ds.slice(5,7),d=+ds.slice(8,10);
  if(y!==F.year)return false;
  if(F.month&&m!==F.month)return false;
  if(F.month&&F.week&&Math.min(5,Math.ceil(d/7))!==F.week)return false;
  return true;
}
var pm=function(y,m){return function(ds){return !!ds&&+ds.slice(0,4)===y&&+ds.slice(5,7)===m}};
function years(){
  var s=new Set();for(var y=2026;y<=2030;y++)s.add(y);s.add(F.year);s.add(S.att.year);
  Object.keys(S.data).forEach(function(c){S.data[c].forEach(function(r){var y=r.date?+r.date.slice(0,4):r.year;if(y)s.add(y)})});
  return Array.from(s).sort(function(a,b){return a-b});
}

/* ---------- lookups and math ---------- */
var agentName=function(r){var a=byId(S.cfg.loanAgents,r.agentId);return a?a.name:(r.agentName||'(removed)')};
var leadsName=function(r){var a=byId(S.cfg.leadsAgents,r.leadsAgentId);return a?a.name:(r.leadsAgentName||'(removed)')};
var bankName=function(r){var b=byId(S.cfg.banks,r.bankId);return b?b.name:(r.bankName||'-')};
var ltName=function(r){var t=byId(S.cfg.loanTypes,r.loanTypeId);return t?t.name:(r.loanTypeName||'-')};
var bankNameById=function(id){var b=byId(S.cfg.banks,id);return b?b.name:'-'};
function rateFor(r,ag){var t=byId(S.cfg.loanTypes,r.loanTypeId);return t?num(t[ag+'Rate']):0}
function nvFor(r){
  var t=byId(S.cfg.loanTypes,r.loanTypeId);
  if(t&&t.netVolume!==null&&t.netVolume!==undefined&&t.netVolume!=='')return num(t.netVolume);
  var b=byId(S.cfg.banks,r.bankId);
  return b&&b.netVolume!==null&&b.netVolume!==undefined&&b.netVolume!==''?num(b.netVolume):100;
}
function taxes(gross,ag){
  var c=S.cfg;
  var t1=gross*num(ag==='orc'?c.tax.orc:c.tax.dms1)/100;
  var after=gross-t1;
  var t2=ag==='dms'?after*num(c.tax.dms2)/100:0;
  return{gross:gross,t1:t1,after:after,t2:t2,net:after-t2,ded:t1+t2};
}
function comm(r,ag){var rate=rateFor(r,ag);var o=taxes(num(r.booked)*rate/100,ag);o.rate=rate;return o}
function leadCalc(r,ag){
  var nv=nvFor(r);var vol=num(r.booked)*nv/100;
  var o=taxes(vol*num(S.cfg.leadsRate[ag])/100,ag);o.nv=nv;o.vol=vol;return o;
}
function loanLeadCalc(r){
  var c=S.cfg.loanLeads,nv=nvFor(r),vol=num(r.booked)*nv/100;
  var gross=vol*num(c.rate)/100,t1=gross*num(c.tax1)/100,after=gross-t1,t2=after*num(c.tax2)/100;
  return{nv:nv,vol:vol,gross:gross,t1:t1,after:after,t2:t2,net:after-t2,ded:t1+t2};
}
function agencyParts(ag,pred){
  var got=0,wait=0;
  S.data['approvals_'+ag].forEach(function(r){
    if(!pred(r.date)||!(num(r.booked)>0))return;
    var n=comm(r,ag).net;
    if(r.payStatus==='PAID')got+=n;else wait+=n;
  });
  return{got:got,wait:wait};
}
function migrateRecv(){
  var rv=S.cfg.recv||{},hasRv=Object.keys(rv).length>0;
  ['orc','dms'].forEach(function(ag){
    S.data['approvals_'+ag].forEach(function(r){
      if(r.payStatus||!(num(r.booked)>0))return;
      var dt=r.recvDate||rv[ag+'|'+String(r.date||'').slice(0,7)+'|'+bankKeyOf(r)];
      if(dt)Store.put('approvals_'+ag,Object.assign({},r,{recvDate:dt,payStatus:'PAID'}));
    });
  });
  if(hasRv){S.cfg.recv={};Store.saveCfg()}
}
function agencyNet(ag,pred){
  var t=agencyParts(ag,pred).got;
  if(S.cfg.includeLeads)t+=sum(S.data['leads_'+ag].filter(function(r){return pred(r.date)}),function(r){return leadCalc(r,ag).net});
  return t;
}
function netSalesAg(id,ag,pred){
  return sum(S.data['approvals_'+ag].filter(function(r){return r.agentId===id&&pred(r.date)}),function(r){return num(r.booked)*nvFor(r)/100});
}
function netSalesAll(id,pred){return netSalesAg(id,'orc',pred)+netSalesAg(id,'dms',pred)}
function incentiveFor(net){
  var best=0;
  S.cfg.incentives.forEach(function(t){if(num(t.threshold)>0&&net>=num(t.threshold))best=Math.max(best,num(t.amount))});
  return best;
}
function agentIncentive(id){
  if(F.month)return incentiveFor(netSalesAll(id,pm(F.year,F.month)));
  var t=0;for(var m=1;m<=12;m++)t+=incentiveFor(netSalesAll(id,pm(F.year,m)));return t;
}

function bankSummary(rows,ag){

  rows.forEach(function(r){

function finData(){

  var oi=sum(inc,function(r){return num(r.amount)}),te=sum(exp,function(r){return num(r.amount)});
  var months=[],T={o:0,d:0,i:0,g:0,e:0,n:0};

function tiStats(rows){
  var by={};
  rows.forEach(function(r){
    var k=r.agentId||('n:'+(r.agentName||'?'));
    var o=by[k]||(by[k]={name:agentName(r),n:0,cp:0,paid:0});
    o.n++;if(r.proof==='Complete proof')o.cp++;if(r.paidDate)o.paid+=num(r.amount);
  });
  var list=Object.keys(by).map(function(k){return by[k]}).sort(function(a,b){return b.n-a.n||b.paid-a.paid||a.name.localeCompare(b.name)});
  var top=list.length?list.filter(function(x){return x.n===list[0].n}):[];
  var paid=sum(rows.filter(function(r){return r.paidDate}),function(r){return num(r.amount)});
  var all=sum(rows,function(r){return num(r.amount)});
  return{list:list,top:top,paid:paid,unpaid:all-paid,all:all,n:rows.length};
}

    Store.put(col,{id:rec?rec.id:uid(),date:v.date,agentId:v.agentId,agentName:a?a.name:(rec?rec.agentName:''),client:v.client.trim(),approved:num(v.approved),booked:num(v.booked),bankId:v.bankId,bankName:b?b.name:'',loanTypeId:v.loanTypeId,loanTypeName:t?t.name:'',status:v.status,payStatus:v.payStatus==='PAID'?'PAID':'Unpaid',recvDate:v.recvDate||(v.payStatus==='PAID'?today():''),ts:rec?rec.ts:Date.now()});
  }});
}
function leadForm(col,rec){
  var c=S.cfg,r=rec||{date:today(),bankId:'',loanTypeId:'',leadsAgentId:'',status:'Pending'};
  var warn=(!c.leadsAgents.length)?'<p class="hint">Add leads agents in Settings first.</p>':'';
  var body=warn+selF('Leads agent','leadsAgentId',[['','Select leads agent']].concat(c.leadsAgents.map(function(a){return [a.id,a.name]})),r.leadsAgentId)+
    inF('Date','date',r.date,'date')+inF('Client full name','client',r.client||'','text')+
    selF('Bank','bankId',bankOpts(),r.bankId)+selF('Loan type','loanTypeId',ltOpts(r.bankId),r.loanTypeId)+
    inF('Book amount (₱)','booked',rec?r.booked:'','num')+
    selF('Commission status','status',[['Pending','Pending'],['Paid','Paid']],r.status==='Paid'?'Paid':'Pending');
  openModal({title:rec?'Edit leads entry':'Add leads entry',body:body,onOpen:function(root){wireBank(root)},onSave:function(v){
    if(!v.leadsAgentId||!v.date||!v.client.trim())return{error:'Choose a leads agent, a date, and enter the client name.'};
    var a=byId(c.leadsAgents,v.leadsAgentId),b=byId(c.banks,v.bankId),t=byId(c.loanTypes,v.loanTypeId);
    Store.put(col,{id:rec?rec.id:uid(),date:v.date,leadsAgentId:v.leadsAgentId,leadsAgentName:a?a.name:(rec?rec.leadsAgentName:''),client:v.client.trim(),booked:num(v.booked),bankId:v.bankId,bankName:b?b.name:'',loanTypeId:v.loanTypeId,loanTypeName:t?t.name:'',status:v.status==='Paid'?'Paid':'Pending',ts:rec?rec.ts:Date.now()});
  }});
}
function loanLeadForm(col,rec){
  var c=S.cfg,r=rec||{date:today(),bankId:'',loanTypeId:'',agentId:'',releasedDate:''};
  var warn=!c.loanAgents.length?'<p class="hint">Add loan agents in Settings first.</p>':'';
  var body=warn+selF('Loan agent','agentId',[['','Select loan agent']].concat(c.loanAgents.map(function(a){return [a.id,a.name]})),r.agentId)+
    inF('Date','date',r.date,'date')+inF('Client full name','client',r.client||'','text')+
    selF('Bank','bankId',bankOpts(),r.bankId)+selF('Loan type','loanTypeId',ltOpts(r.bankId),r.loanTypeId)+
    inF('Book amount (₱)','booked',rec?r.booked:'','num')+inF('Released date (leave blank if not yet released)','releasedDate',r.releasedDate||'','date');
  openModal({title:rec?'Edit loan agent lead':'Add loan agent lead',body:body,onOpen:function(root){wireBank(root)},onSave:function(v){
    if(!v.agentId||!v.date||!v.client.trim())return{error:'Choose a loan agent, a date, and enter the client name.'};
    var a=byId(c.loanAgents,v.agentId),b=byId(c.banks,v.bankId),t=byId(c.loanTypes,v.loanTypeId);
    Store.put(col,{id:rec?rec.id:uid(),date:v.date,agentId:v.agentId,agentName:a?a.name:(rec?rec.agentName:''),client:v.client.trim(),booked:num(v.booked),bankId:v.bankId,bankName:b?b.name:'',loanTypeId:v.loanTypeId,loanTypeName:t?t.name:'',releasedDate:v.releasedDate||'',ts:rec?rec.ts:Date.now()});
  }});
}
function moneyForm(col,rec){
  var isInc=col==='income',cats=(isInc?S.cfg.incomeCats:S.cfg.expenseCats).map(function(x){return x.name});
  var r=rec||{date:today(),category:cats[0]||''};
  if(r.category&&cats.indexOf(r.category)<0)cats=cats.concat([r.category]);
  var body=inF('Date','date',r.date,'date')+inF('Description','desc',r.desc||'','text')+
    selF('Category','category',[['','No category']].concat(cats.map(function(x){return [x,x]})),r.category)+inF('Amount (₱)','amount',rec?r.amount:'','num');
  openModal({title:(rec?'Edit ':'Add ')+(isInc?'income':'expense'),body:body,onSave:function(v){
    if(!v.date||!v.desc.trim()||!num(v.amount))return{error:'Enter a date, a description, and an amount.'};
    Store.put(col,{id:rec?rec.id:uid(),date:v.date,desc:v.desc.trim(),category:v.category,amount:num(v.amount),ts:rec?rec.ts:Date.now()});
  }});
}
function attForm(rec){
  var c=S.cfg,A=S.att;
  var r=rec||{year:A.year,month:A.month,half:A.half,agency:'orc',agentId:'',rate:'',days:'',ca:0,cb:c.cashBond,status:'Pending'};
  var warn=!c.loanAgents.length?'<p class="hint">Add loan agents in Settings first.</p>':'';
  var body='<p class="hint">Period: '+MN[r.month-1]+' '+r.year+', '+(r.half===1?'1 to 15':'16 to end of month')+'</p>'+warn+
    selF('Agency','agency',[['orc','ORC'],['dms','DMS']],r.agency)+
    selF('Agent','agentId',[['','Select agent']].concat(c.loanAgents.map(function(a){return [a.id,a.name]})),r.agentId)+
    inF('Daily rate (₱)','rate',r.rate,'num')+inF('Number of days','days',r.days,'num')+
    inF('Cash advance (₱)','ca',r.ca,'num')+inF('Cash bond (₱)','cb',r.cb,'num')+
    selF('Status','status',[['Pending','Pending'],['Paid','Paid']],r.status);
  openModal({title:rec?'Edit attendance':'Add attendance',body:body,onOpen:function(root){
    var s=root.querySelector('[name=agentId]'),rt=root.querySelector('[name=rate]');
    s.onchange=function(){var a=byId(c.loanAgents,s.value);if(a)rt.value=num(a.dailyRate)};
  },onSave:function(v){
    if(!v.agentId)return{error:'Choose an agent.'};
    var a=byId(c.loanAgents,v.agentId);
    Store.put('attendance',{id:rec?rec.id:uid(),year:r.year,month:r.month,half:r.half,agency:v.agency,agentId:v.agentId,agentName:a?a.name:(rec?rec.agentName:''),rate:num(v.rate),days:num(v.days),ca:num(v.ca),cb:num(v.cb),status:v.status,ts:rec?rec.ts:Date.now()});
  }});
}
function openForm(col,rec){
  if(col.indexOf('approvals_')===0)approvalForm(col,rec);
  else if(col.indexOf('leads_')===0)leadForm(col,rec);
  else if(col.indexOf('loanleads_')===0)loanLeadForm(col,rec);
  else if(col==='income'||col==='expenses')moneyForm(col,rec);
  else if(col==='attendance')attForm(rec);
  else if(col==='turnins')tiForm(rec);
}
function listForm(key,rec){
  var L=LISTS[key];
  var body=L.f.map(function(f){
    var k=f[0],l=f[1],t=f[2],val=rec?rec[k]:(k==='netVolume'&&key==='banks'?100:'');
    if(t==='bank')return selF(l,k,bankOpts(),val||'');
    return inF(l,k,val,t==='text'?'text':'num');
  }).join('');
  openModal({title:(rec?'Edit ':'Add ')+L.one,body:body,onSave:function(v){
    var item={};
    for(var i=0;i<L.f.length;i++){
      var k=L.f[i][0],t=L.f[i][2];
      if(t==='text'){if(!v[k].trim())return{error:'Please fill in the name.'};item[k]=v[k].trim()}
      else if(t==='bank'){if(!v[k])return{error:'Choose a bank. Add banks first if the list is empty.'};item[k]=v[k]}
      else if(t==='numopt')item[k]=v[k]===''?null:num(v[k]);
      else item[k]=num(v[k]);
    }
    if(rec)Object.assign(rec,item);else S.cfg[key].push(Object.assign({id:uid()},item));
    Store.saveCfg();render();
  }});
}

/* ---------- render + events ---------- */
function render(){
  if(S.loaded&&!S.migrated){S.migrated=true;setTimeout(migrateRecv,0)}
  try{
    var t=[['orc','ORC'],['dms','DMS'],['ti','LA Carded'],['fin','Financial'],['att','Attendance'],['set','Settings']];
    var nav=$('#nav');
    if(!nav.children.length)nav.innerHTML=t.map(function(x){return '<button class="tab" data-act="view" data-v="'+x[0]+'">'+x[1]+'</button>'}).join('');
    Array.prototype.forEach.call(nav.children,function(b){if(b.dataset.v===S.view)b.setAttribute('aria-current','true');else b.removeAttribute('aria-current')});
    var lk=!S.unlocked;
    document.body.classList.toggle('locked',lk);
    $('#lockbtn').hidden=lk;
    if(lk){if(!$('#pin'))$('#app').innerHTML=lockHtml();return}
    var h;
    if(!S.loaded)h='<p class="empty">Connecting to your database...</p>';
    else if(S.view==='orc'||S.view==='dms')h=agencyView(S.view);
    else if(S.view==='ti')h=tiView();
    else if(S.view==='fin')h=finView();
    else if(S.view==='att')h=attView();
    else h=setView();
    $('#app').innerHTML=h;
  }catch(e){$('#app').innerHTML='<p class="empty">Something went wrong showing this page: '+esc(e.message)+'</p>'}
}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var d=b.dataset;
  switch(d.act){
    case 'view':S.view=d.v;render();window.scrollTo(0,0);break;
    case 'sub':S.sub[S.view]=d.v;render();break;
    case 'add':openForm(d.col,null);break;
    case 'edit':openForm(d.col,byId(S.data[d.col],d.id));break;
    case 'del':ask('Delete this entry? This cannot be undone.',function(){Store.del(d.col,d.id)});break;
    case 'att-half':S.att.half=+d.v;render();break;
    case 'lead-toggle':var lr0=byId(S.data[d.col],d.id);if(lr0)Store.put(d.col,Object.assign({},lr0,{status:lr0.status==='Paid'?'Pending':'Paid'}));break;
    case 'll-toggle':var ll0=byId(S.data[d.col],d.id);if(ll0)Store.put(d.col,Object.assign({},ll0,{releasedDate:ll0.releasedDate?'':today()}));break;
    case 'att-toggle':var r=byId(S.data.attendance,d.id);if(r)Store.put('attendance',Object.assign({},r,{status:r.status==='Paid'?'Pending':'Paid'}));break;
    case 's-add':listForm(d.list,null);break;
    case 's-edit':listForm(d.list,byId(S.cfg[d.list],d.id));break;
    case 's-del':ask('Delete this item? Existing records keep the name they were saved with.',function(){S.cfg[d.list]=S.cfg[d.list].filter(function(x){return x.id!==d.id});Store.saveCfg();render()});break;
    case 'goto-rates':S.view=d.ag;S.sub[d.ag]='com';S.open['rates-'+d.ag]=true;render();window.scrollTo(0,0);break;
    case 'close':closeModal();break;
    case 'lock':lockNow();break;
    case 'import':var imf=$('#impfile');if(imf)imf.click();break;
    case 'unlock':tryUnlock();break;
    case 'export':if(d.what==='fin')exportFin();else if(d.what==='ti')exportTi();else exportAgency(d.what);break;
    case 'backup':exportBackup();break;
    case 'pin-change':pinForm();break;
    case 'save':
      if(!MS)break;
      var cur=MS,vals=modalVals();
      Promise.resolve().then(function(){return cur.onSave(vals)}).then(function(res){
        if(res&&res.error){var m=$('#merr');if(m)m.textContent=res.error}else if(MS===cur)closeModal();
      }).catch(function(err){var m=$('#merr');if(m)m.textContent='Something went wrong: '+((err&&err.message)||'try again')});
      break;
  }
});
document.addEventListener('change',function(e){
  var el=e.target,d=el.dataset;
  if(el.id==='impfile'){importFile(el.files&&el.files[0]);el.value='';return}
  if(d.f){F[d.f]=+el.value;if(d.f==='month'&&!F.month)F.week=0;render()}
  else if(d.fa==='agent'){S.fAgent=el.value;render()}
  else if(d.fa==='status'){S.fStatus=el.value;render()}
  else if(d.fa==='sel'){S.agentSel[d.ag]=el.value;render()}
  else if(d.fa==='attf'){S.att[d.k]=+el.value;render()}
  else if(d.tproof){var tp=byId(S.data.turnins,d.tproof);if(tp)Store.put('turnins',Object.assign({},tp,{proof:el.value==='Incomplete proof'?'Incomplete proof':'Complete proof'}))}
  else if(d.tpaid){var tq=byId(S.data.turnins,d.tpaid);if(tq)Store.put('turnins',Object.assign({},tq,{paidDate:el.value||''}))}
  else if(d.pay){var pr=byId(S.data[d.col],d.pay);if(pr){var pv=el.value==='PAID'?'PAID':'Unpaid';Store.put(d.col,Object.assign({},pr,{payStatus:pv,recvDate:pv==='PAID'?(pr.recvDate||today()):''}))}}
  else if(d.rrow){var rr=byId(S.data[d.col],d.rrow);if(rr)Store.put(d.col,Object.assign({},rr,{recvDate:el.value||''}))}
  else if(d.rgrp){apprRows(d.rag).filter(function(r){return num(r.booked)>0&&bankKeyOf(r)===d.rgrp}).forEach(function(r){Store.put('approvals_'+d.rag,Object.assign({},r,{recvDate:el.value||''}))})}
  else if(d.cfg){setPath(S.cfg,d.cfg,num(el.value));Store.saveCfg();render()}
  else if(d.cfgbool){setPath(S.cfg,d.cfgbool,el.checked);Store.saveCfg();render()}
  else if(d.list){var it=byId(S.cfg[d.list],d.id);if(it){it[d.field]=num(el.value);Store.saveCfg();render()}}
});
document.addEventListener('toggle',function(e){var k=e.target&&e.target.dataset&&e.target.dataset.k;if(k)S.open[k]=e.target.open},true);
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&MS)closeModal();
  if(e.key==='Enter'&&e.target&&e.target.id==='pin')tryUnlock();
});

render();
(function(){var p=sget();if(p)openWith(p).catch(function(){sset('')})})();
})();
</script>
