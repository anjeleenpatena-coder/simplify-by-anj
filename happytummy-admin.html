<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Tummy | Orders</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@600;700;800;900&display=swap">
<style>
:root{--sun:#FFD43B;--cocoa:#3A1D10;--tomato:#C8321F;--paper:#fff;--butter:#FFF1C2;--muted:#6F4B38;--line:#EBD9B8;--leaf:#1F7A3A}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;font-family:'Nunito',system-ui,sans-serif;font-weight:700;font-size:16px;line-height:1.4;color:var(--cocoa);background:var(--sun)}
.wrap{max-width:760px;margin:0 auto;padding:18px 14px 60px}
h1,h2{font-family:'Fredoka','Nunito',sans-serif;margin:0}
h1{font-size:34px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cocoa);outline-offset:2px}
.card{background:var(--paper);border-radius:22px;padding:16px;margin-top:14px}
.in{width:100%;border:2px solid var(--line);border-radius:12px;padding:11px 12px;min-height:46px;margin:4px 0 12px;font-weight:700}
.btn{border:0;border-radius:999px;background:var(--cocoa);color:#fff;font-weight:900;padding:10px 18px;min-height:44px;cursor:pointer}
.btn.red{background:var(--tomato)} .btn.green{background:var(--leaf)}
.btn.line{background:#fff;color:var(--cocoa);border:2px solid var(--cocoa)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{border:2px solid var(--cocoa);background:#fff;border-radius:999px;padding:6px 14px;font-weight:900;min-height:40px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--cocoa);color:var(--sun)}
.head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.no{font-family:'Fredoka',sans-serif;font-size:22px}
.badge{border-radius:999px;padding:3px 12px;font-weight:900;font-size:14px;background:var(--butter)}
.badge.pending{background:#FFE08A} .badge.confirmed,.badge.preparing,.badge.out_for_delivery{background:#CDEBD6;color:#0F4D22}
.badge.delivered{background:#E3E3E3} .badge.rejected{background:#FAD4CE;color:#7A1A0E}
.meta{color:var(--muted);font-size:14px}
dl{margin:10px 0 0;display:grid;grid-template-columns:110px 1fr;gap:4px 10px}
dt{color:var(--muted)} dd{margin:0;font-weight:800;overflow-wrap:anywhere}
.items{background:var(--butter);border-radius:14px;padding:10px 12px;margin-top:10px}
.items div{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.items small{display:block;color:var(--muted)}
.items .tot{border-top:2px solid var(--line);margin-top:6px;padding-top:6px;font-weight:900;font-size:18px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.warn{background:#FAD4CE;color:#7A1A0E;border-radius:12px;padding:8px 10px;margin-top:10px;font-weight:800}
.msg{margin:10px 0 0;font-weight:800}
.tabs{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.tabbtn{flex:1 1 40%;border:2px solid var(--cocoa);background:#fff;border-radius:999px;padding:10px 6px;font-weight:900;font-size:15px;min-height:48px;cursor:pointer}
.tabbtn[aria-selected="true"]{background:var(--cocoa);color:var(--sun)}
.grp{font-family:'Fredoka','Nunito',sans-serif;font-size:22px;color:var(--tomato);margin:0 0 4px}
.mi{border-top:2px dotted var(--line);padding:12px 0;display:grid;grid-template-columns:1fr 110px;gap:8px 10px}
.mi:first-of-type{border-top:0}
.mi label{font-size:13px;color:var(--muted);display:block}
.mi .in{margin:2px 0 0}
.mi .wide{grid-column:1 / -1}
.mi.sold_out{background:#FFF3D6;margin:0 -10px;padding:12px 10px;border-radius:12px}
.mi.unavailable,.mi.hidden{background:#F1F1F1;margin:0 -10px;padding:12px 10px;border-radius:12px}
.saved{grid-column:1 / -1;font-size:14px;font-weight:900;color:var(--leaf);min-height:18px}
.saved.no{color:var(--tomato)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.stat{background:var(--paper);border-radius:18px;padding:12px 14px}
.stat span{display:block;font-size:13.5px;color:var(--muted)}
.stat b{font-family:'Fredoka','Nunito',sans-serif;font-size:26px;line-height:1.1;display:block;overflow-wrap:anywhere}
.stat small{display:block;font-size:12.5px;color:var(--muted)}
.stat.big{grid-column:1 / -1;background:var(--cocoa);color:#fff}
.stat.big span,.stat.big small{color:#FFE9A8}
.stat.big b{font-size:34px;color:var(--sun)}
.stat.big.neg b{color:#FFB3A6}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:right;padding:8px 3px;border-bottom:2px dotted var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12.5px;color:var(--muted)}
td.neg{color:var(--tomato)} td.pos{color:var(--leaf)}
.ent{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:2px dotted var(--line);padding:10px 0}
.ent:first-of-type{border-top:0}
.ent small{display:block;color:var(--muted);font-size:13px}
.ent .amt{font-weight:900;white-space:nowrap}
.ent .x{border:2px solid var(--tomato);color:var(--tomato);background:#fff;border-radius:999px;min-width:44px;min-height:44px;font-weight:900;cursor:pointer}
.pc{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:2px dotted var(--line);padding:12px 0}
.pc:first-child{border-top:0}
.pc b{font-family:'Fredoka','Nunito',sans-serif;font-size:22px;display:block}
.pc.off b,.pc.off span{color:#8A7468}
.quick{display:flex;gap:5px;flex-wrap:wrap}
.quick button{border:2px solid var(--cocoa);background:#fff;border-radius:999px;padding:6px 9px;font-weight:900;font-size:13px;min-height:42px;cursor:pointer}
.quick button[aria-pressed="true"]{background:var(--cocoa);color:#fff}
.quick button[data-v="sold_out"][aria-pressed="true"],.quick button[data-v="unavailable"][aria-pressed="true"]{background:var(--tomato);border-color:var(--tomato)}
dialog{border:0;border-radius:18px;padding:12px;max-width:min(94vw,560px)}
dialog img{display:block;max-width:100%;max-height:74vh;margin:0 auto 10px;border-radius:10px}
dialog::backdrop{background:rgba(58,29,16,.7)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Happy Tummy orders</h1>
    <button class="btn line" id="logout" hidden>Log out</button>
  </div>

  <section class="card" id="login">
    <h2>Admin login</h2>
    <p class="meta">Use the same email and password as your Simplify by Anj admin.</p>
    <label for="email">Email</label>
    <input class="in" id="email" type="email" autocomplete="username">
    <label for="pw">Password</label>
    <input class="in" id="pw" type="password" autocomplete="current-password">
    <button class="btn" id="loginBtn">Log in</button>
    <p class="msg" id="loginMsg" role="alert"></p>
  </section>

  <section id="app" hidden>
    <div class="tabs" role="tablist">
      <button class="tabbtn" role="tab" id="tabOrders" aria-selected="true">Orders</button>
      <button class="tabbtn" role="tab" id="tabMenu" aria-selected="false">Edit menu</button>
      <button class="tabbtn" role="tab" id="tabPromos" aria-selected="false">Promo codes</button>
      <button class="tabbtn" role="tab" id="tabMoney" aria-selected="false">Money tracker</button>
    </div>
    <div id="ordersView">
      <div class="filters" id="filters"></div>
      <p class="msg" id="appMsg" role="status"></p>
      <div id="list"></div>
    </div>
    <div id="menuView" hidden>
      <p class="msg" id="menuMsg" role="status"></p>
      <div id="menuList"></div>
      <section class="card">
        <h2>Add new food or drink</h2>
        <label for="newGrp">Section</label>
        <select class="in" id="newGrp"></select>
        <input class="in" id="newGrpName" placeholder="Name of the new section" maxlength="60" hidden aria-label="Name of the new section">
        <label for="newName">Item name</label>
        <input class="in" id="newName" maxlength="80">
        <label for="newPrice">Price (₱)</label>
        <input class="in" id="newPrice" type="number" inputmode="numeric" min="0" step="1">
        <label for="newEgg">Egg option</label>
        <select class="in" id="newEgg"><option value="">No egg option</option><option value="add">Can add egg (+₱20)</option><option value="in">Egg included</option></select>
        <button class="btn" id="addItem">Add item</button>
        <p class="msg" id="addMsg" role="status"></p>
      </section>
    </div>
    <div id="promosView" hidden>
      <p class="msg" id="promoMsg" role="status"></p>
      <div id="promoList"></div>
      <section class="card">
        <h2>Add a promo code</h2>
        <label for="pcCode">Code</label>
        <input class="in" id="pcCode" maxlength="20" autocapitalize="characters" placeholder="Example: HAPPY10" style="text-transform:uppercase">
        <label for="pcKind">What does it give?</label>
        <select class="in" id="pcKind"><option value="percent">Percent off the food (%)</option><option value="amount">Pesos off the food (₱)</option><option value="free_delivery">Free delivery</option></select>
        <div id="pcValueWrap"><label for="pcValue" id="pcValueLabel">How many percent off?</label>
        <input class="in" id="pcValue" type="number" inputmode="numeric" min="1" step="1"></div>
        <label for="pcMin">Minimum order in pesos (optional)</label>
        <input class="in" id="pcMin" type="number" inputmode="numeric" min="0" step="1" placeholder="0">
        <button class="btn" id="pcAdd">Add promo code</button>
        <p class="msg" id="pcMsg" role="status"></p>
      </section>
    </div>
    <div id="moneyView" hidden>
      <div class="filters" id="periods"></div>
      <p class="meta" id="periodLabel" style="margin:10px 0 0;color:var(--cocoa)"></p>
      <p class="msg" id="moneyMsg" role="status"></p>
      <div class="stats" id="stats"></div>
      <section class="card">
        <h2 id="breakTitle">Day by day</h2>
        <div class="scroll" id="breakdown"></div>
      </section>
      <section class="card">
        <h2>Add capital, expense, or other sale</h2>
        <label for="fDate">Date</label>
        <input class="in" id="fDate" type="date">
        <label for="fKind">Type</label>
        <select class="in" id="fKind">
          <option value="expense">Expense (ingredients, packaging, gas, rider)</option>
          <option value="capital">Capital (equipment, starting stock, puhunan)</option>
          <option value="other_sale">Other sale (order not from the order form)</option>
        </select>
        <label for="fNote">What is it for?</label>
        <input class="in" id="fNote" maxlength="200" placeholder="Example: rice 25kg, eggs 2 trays">
        <label for="fAmount">Amount (₱)</label>
        <input class="in" id="fAmount" type="number" inputmode="decimal" min="0" step="0.01">
        <button class="btn" id="fAdd">Add entry</button>
        <p class="msg" id="fMsg" role="status"></p>
      </section>
      <section class="card">
        <h2>Entries in this period</h2>
        <div id="entries"></div>
      </section>
    </div>
  </section>
</div>
<dialog id="viewer"><img id="viewerImg" alt=""><button class="btn" id="viewerClose">Close</button></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
'use strict';
var SUPABASE_URL='https://djffchbmdvclzcfvoyhi.supabase.co';
var SUPABASE_KEY='sb_publishable__zMWLW4AsgYkDMFJGZH_Sg_2apYlo-i';
var BUCKET='happy-tummy-uploads';
var $=function(id){return document.getElementById(id)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var peso=function(n){return '₱'+Number(n).toLocaleString('en-PH')};
var LABEL={pending:'Payment to check',confirmed:'Payment confirmed',preparing:'Preparing',out_for_delivery:'Out for delivery',delivered:'Delivered',rejected:'Rejected'};
var FILTERS=[['open','Open orders'],['pending','Payment to check'],['delivered','Delivered'],['rejected','Rejected'],['all','All']];
var sb=(window.supabase&&window.supabase.createClient)?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
var orders=[], filter='open', timer=null;

if(!sb){$('loginMsg').textContent='Could not connect. Check your internet, then refresh.';return;}

$('loginBtn').addEventListener('click',function(){
  $('loginMsg').textContent='Logging in…';
  sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('pw').value}).then(function(r){
    if(r.error){$('loginMsg').textContent='Wrong email or password. Try again.';return;}
    $('loginMsg').textContent=''; start();
  });
});
$('pw').addEventListener('keydown',function(e){if(e.key==='Enter') $('loginBtn').click()});
$('logout').addEventListener('click',function(){sb.auth.signOut().then(function(){location.reload()})});
sb.auth.getSession().then(function(r){if(r.data&&r.data.session) start()});

function start(){
  $('login').hidden=true; $('app').hidden=false; $('logout').hidden=false;
  $('filters').innerHTML=FILTERS.map(function(f){return '<button class="chip" data-f="'+f[0]+'" aria-pressed="'+(f[0]===filter)+'">'+f[1]+'</button>'}).join('');
  load(); clearInterval(timer); timer=setInterval(load,60000);
}
$('filters').addEventListener('click',function(e){
  var c=e.target.closest('.chip'); if(!c) return; filter=c.dataset.f;
  document.querySelectorAll('.chip').forEach(function(x){x.setAttribute('aria-pressed',x.dataset.f===filter)}); draw();
});
function load(){
  sb.from('happy_tummy_orders').select('*').order('created_at',{ascending:false}).limit(300).then(function(r){
    if(r.error){$('appMsg').textContent='Could not load orders. Refresh the page.';return;}
    orders=r.data||[]; draw();
  });
}
function draw(){
  var refs={}; orders.forEach(function(o){var k=(o.payment_ref||'').replace(/[^a-z0-9]/gi,'').toLowerCase(); if(k) refs[k]=(refs[k]||0)+1; o._k=k;});
  var rows=orders.filter(function(o){
    if(filter==='all') return true;
    if(filter==='open') return ['pending','confirmed','preparing','out_for_delivery'].indexOf(o.status)>-1;
    return o.status===filter;
  });
  $('appMsg').textContent=rows.length?'':'No orders here yet.';
  $('list').innerHTML=rows.map(function(o){
    var items=(o.items||[]).map(function(l){
      var extra=[l.egg,l.note].filter(Boolean).join(', ');
      return '<div><span>'+esc(l.qty)+' x '+esc(l.name)+(extra?'<small>'+esc(extra)+'</small>':'')+'</span><span>'+peso(l.line_total)+'</span></div>';
    }).join('');
    var when=new Date(o.created_at).toLocaleString('en-PH',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
    var tel=esc(o.mobile);
    var acts='';
    if(o.status==='pending') acts+='<button class="btn green" data-s="confirmed">Confirm payment</button><button class="btn red" data-s="rejected">Reject</button>';
    if(o.status==='confirmed') acts+='<button class="btn green" data-s="preparing">Start preparing</button>';
    if(o.status==='preparing') acts+='<button class="btn green" data-s="out_for_delivery">Out for delivery</button>';
    if(o.status==='out_for_delivery') acts+='<button class="btn green" data-s="delivered">Mark delivered</button>';
    if(o.status==='rejected'||o.status==='delivered') acts+='<button class="btn line" data-s="pending">Move back to check</button>';
    acts+='<button class="btn line" data-img="'+esc(o.proof_path)+'">View receipt</button>';
    if(o.house_photo_path) acts+='<button class="btn line" data-img="'+esc(o.house_photo_path)+'">View house photo</button>';
    acts+='<button class="btn line" data-copy="1">Copy Messenger message</button>';
    return '<article class="card" data-id="'+esc(o.id)+'">'+
      '<div class="head"><div><div class="no">'+esc(o.order_no)+'</div><div class="meta">'+esc(when)+'</div></div><span class="badge '+esc(o.status)+'">'+esc(LABEL[o.status]||o.status)+'</span></div>'+
      (refs[o._k]>1?'<div class="warn">This reference number was used on another order. Check your app before you confirm.</div>':'')+
      '<dl><dt>Name</dt><dd>'+esc(o.customer_name)+'</dd><dt>Messenger</dt><dd>'+esc(o.fb_name)+'</dd>'+
      '<dt>Mobile</dt><dd><a href="tel:'+tel+'">'+tel+'</a></dd><dt>Address</dt><dd>'+esc(o.address)+'</dd>'+
      '<dt>Landmark</dt><dd>'+esc(o.landmark)+'</dd>'+(o.delivery_time?'<dt>Deliver at</dt><dd>'+esc(o.delivery_time)+'</dd>':'')+(o.notes?'<dt>Notes</dt><dd>'+esc(o.notes)+'</dd>':'')+
      '<dt>Paid with</dt><dd>'+esc(o.paid_via)+'</dd><dt>Reference</dt><dd>'+esc(o.payment_ref)+'</dd></dl>'+
      '<div class="items">'+items+'<div><span>Delivery fee</span><span>'+peso(o.delivery_fee)+'</span></div>'+(o.discount>0?'<div><span>Promo '+esc(o.promo_code)+'</span><span>&minus;'+peso(o.discount)+'</span></div>':'')+'<div class="tot"><span>Total</span><span>'+peso(o.total)+'</span></div></div>'+
      '<div class="acts">'+acts+'</div></article>';
  }).join('');
}
$('list').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b) return;
  var card=b.closest('article'), id=card.dataset.id, o=orders.filter(function(x){return x.id===id})[0];
  if(b.dataset.s){
    var s=b.dataset.s;
    if(s==='confirmed'&&!confirm('Did you check your GCash, Maya, or bank app and see '+peso(o.total)+' from this customer?')) return;
    if(s==='rejected'&&!confirm('Reject this order?')) return;
    b.disabled=true;
    sb.from('happy_tummy_orders').update({status:s}).eq('id',id).then(function(r){
      if(r.error){b.disabled=false;alert('Could not save. Try again.');return;} load();
    });
  }
  if(b.dataset.img){
    sb.storage.from(BUCKET).createSignedUrl(b.dataset.img,600).then(function(r){
      if(r.error||!r.data){alert('Could not open the photo.');return;}
      $('viewerImg').src=r.data.signedUrl; $('viewer').showModal();
    });
  }
  if(b.dataset.copy){
    var first=(o.customer_name||'').split(' ')[0];
    var text={
      pending:'Hi '+first+'! This is Happy Tummy. We got your order '+o.order_no+'. We are checking your payment now.',
      confirmed:'Hi '+first+'! This is Happy Tummy. Your payment for order '+o.order_no+' is confirmed. We are preparing it now.',
      preparing:'Hi '+first+'! Your Happy Tummy order '+o.order_no+' is being prepared now.',
      out_for_delivery:'Hi '+first+'! Your Happy Tummy order '+o.order_no+' is on the way.',
      delivered:'Hi '+first+'! Your Happy Tummy order '+o.order_no+' was delivered. Thank you, enjoy your meal!',
      rejected:'Hi '+first+'! This is Happy Tummy. We could not find your payment for order '+o.order_no+'. Please send your receipt here so we can check.'
    }[o.status];
    navigator.clipboard.writeText(text).then(function(){b.textContent='Copied';setTimeout(function(){b.textContent='Copy Messenger message'},1800)});
  }
});
$('viewerClose').addEventListener('click',function(){$('viewer').close()});

/* ---------- menu editor ---------- */
var menu=[];
var STATUS=[['available','Available'],['sold_out','Sold out'],['unavailable','Unavailable'],['hidden','Hide']];
function showTab(which){
  [['orders','tabOrders'],['menu','tabMenu'],['promos','tabPromos'],['money','tabMoney']].forEach(function(t){
    $(t[0]+'View').hidden=t[0]!==which; $(t[1]).setAttribute('aria-selected',t[0]===which);
  });
  if(which==='menu') loadMenu();
  if(which==='promos') loadPromos();
  if(which==='money') startMoney();
}
$('tabMoney').addEventListener('click',function(){showTab('money')});
$('tabPromos').addEventListener('click',function(){showTab('promos')});

/* ---------- promo codes ---------- */
var promos=[];
function promoLabel(p){
  var t=p.kind==='percent'?(p.value+'% off the food'):p.kind==='amount'?(peso(p.value)+' off the food'):'Free delivery';
  return t+(p.min_order?(', minimum order '+peso(p.min_order)):'');
}
function loadPromos(){
  sb.from('happy_tummy_promos').select('*').order('created_at',{ascending:false}).then(function(r){
    if(r.error){$('promoMsg').textContent='Could not load promo codes. Refresh the page.';return;}
    promos=r.data||[];
    $('promoMsg').textContent=promos.length?'':'No promo codes yet. Add your first one below.';
    $('promoList').innerHTML=promos.length?('<section class="card">'+promos.map(function(p){
      return '<div class="pc '+(p.active?'':'off')+'" data-code="'+esc(p.code)+'"><div><b>'+esc(p.code)+'</b><span>'+esc(promoLabel(p))+(p.active?'':' (turned off)')+'</span></div>'+
        '<div class="acts" style="margin:0"><button class="btn '+(p.active?'line':'green')+'" data-act="toggle">'+(p.active?'Turn off':'Turn on')+'</button><button class="btn red" data-act="del">Delete</button></div></div>';
    }).join('')+'</section>'):'';
  });
}
$('promoList').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b) return;
  var code=b.closest('.pc').dataset.code, p=promos.filter(function(x){return x.code===code})[0];
  var q=sb.from('happy_tummy_promos');
  if(b.dataset.act==='del'){ if(!confirm('Delete promo code '+code+'?')) return; q=q.delete().eq('code',code); }
  else q=q.update({active:!p.active}).eq('code',code);
  b.disabled=true;
  q.then(function(r){ if(r.error){b.disabled=false;alert('Could not save. Try again.');return;} loadPromos(); });
});
function pcKindChanged(){
  var k=$('pcKind').value; $('pcValueWrap').hidden=k==='free_delivery';
  $('pcValueLabel').textContent=k==='percent'?'How many percent off?':'How many pesos off?';
}
$('pcKind').addEventListener('change',pcKindChanged);
$('pcAdd').addEventListener('click',function(){
  var code=$('pcCode').value.trim().toUpperCase().replace(/\s+/g,''), kind=$('pcKind').value;
  var value=kind==='free_delivery'?0:Math.round(Number($('pcValue').value)), min=Math.round(Number($('pcMin').value||0));
  var m=$('pcMsg');
  if(!/^[A-Z0-9]{3,20}$/.test(code)){m.textContent='Type a code with 3 to 20 letters or numbers, no spaces.';return;}
  if(kind==='percent'&&!(value>=1&&value<=100)){m.textContent='Type a percent from 1 to 100.';return;}
  if(kind==='amount'&&!(value>=1)){m.textContent='Type how many pesos off.';return;}
  if(!(min>=0)){m.textContent='Minimum order must be a number.';return;}
  if(promos.some(function(x){return x.code===code})){m.textContent='You already have a code named '+code+'.';return;}
  m.textContent='Adding…';
  sb.from('happy_tummy_promos').insert({code:code,kind:kind,value:value,min_order:min}).then(function(r){
    if(r.error){m.textContent='Not added. Try again.';return;}
    m.textContent='Added '+code+'. Customers can use it now.'; $('pcCode').value=''; $('pcValue').value=''; $('pcMin').value=''; loadPromos();
  });
});
$('tabOrders').addEventListener('click',function(){showTab('orders')});
$('tabMenu').addEventListener('click',function(){showTab('menu')});
function loadMenu(){
  sb.from('happy_tummy_menu').select('*').order('sort',{ascending:true}).then(function(r){
    if(r.error){$('menuMsg').textContent='Could not load the menu. Refresh the page.';return;}
    $('menuMsg').textContent=''; menu=r.data||[]; drawMenu();
  });
}
function drawMenu(){
  var groups=[], gmap={};
  menu.forEach(function(it){ if(!gmap[it.grp]){gmap[it.grp]=[];groups.push(it.grp);} gmap[it.grp].push(it); });
  $('menuList').innerHTML=groups.map(function(g){
    return '<section class="card"><h2 class="grp">'+esc(g)+'</h2>'+gmap[g].map(function(it){
      var id=esc(it.id);
      return '<div class="mi '+esc(it.status)+'" data-id="'+id+'">'+
        '<div><label for="n-'+id+'">Item name</label><input class="in" id="n-'+id+'" data-f="name" maxlength="80" value="'+esc(it.name)+'"></div>'+
        '<div><label for="p-'+id+'">Price (₱)</label><input class="in" id="p-'+id+'" data-f="price" type="number" inputmode="numeric" min="0" step="1" value="'+esc(it.price)+'"></div>'+
        '<div class="wide quick" role="group" aria-label="Status of '+esc(it.name)+'">'+STATUS.map(function(s){return '<button type="button" data-v="'+s[0]+'" aria-pressed="'+(it.status===s[0])+'">'+s[1]+'</button>'}).join('')+'</div>'+
        '<div class="saved" role="status"></div></div>';
    }).join('')+'</section>';
  }).join('');
  $('newGrp').innerHTML=groups.map(function(g){return '<option>'+esc(g)+'</option>'}).join('')+'<option value="__new">New section…</option>';
  $('newGrpName').hidden=$('newGrp').value!=='__new';
}
function saveItem(row,patch,okText){
  var id=row.dataset.id, note=row.querySelector('.saved');
  note.className='saved'; note.textContent='Saving…';
  patch.updated_at=new Date().toISOString();
  return sb.from('happy_tummy_menu').update(patch).eq('id',id).select('id').then(function(r){
    if(r.error||!r.data||!r.data.length){note.className='saved no';note.textContent='Not saved. Try again.';return false;}
    var it=menu.filter(function(x){return x.id===id})[0]; for(var k in patch) it[k]=patch[k];
    note.textContent=okText||'Saved. Customers see it when they open or refresh the order page.'; return true;
  });
}
$('menuList').addEventListener('change',function(e){
  var f=e.target.dataset.f, row=e.target.closest('.mi'); if(!f||!row) return;
  if(f==='name'){
    var v=e.target.value.trim(); if(!v){e.target.value=menu.filter(function(x){return x.id===row.dataset.id})[0].name;return;}
    var cur=menu.filter(function(x){return x.id===row.dataset.id})[0];
    saveItem(row,{name:v,full_name:cur.full_name?(cur.grp+' ('+v+')'):null});
  }
  if(f==='price'){
    var n=Math.round(Number(e.target.value));
    if(!isFinite(n)||n<0||e.target.value===''){var note=row.querySelector('.saved');note.className='saved no';note.textContent='Type a price, numbers only.';return;}
    e.target.value=n; saveItem(row,{price:n});
  }
});
$('menuList').addEventListener('click',function(e){
  var b=e.target.closest('.quick button'); if(!b) return;
  var row=b.closest('.mi'), v=b.dataset.v;
  var text={available:'Saved. This item can be ordered again.',sold_out:'Saved. Customers see it as Sold out and cannot tick it.',unavailable:'Saved. Customers see it as Unavailable and cannot tick it.',hidden:'Saved. This item is hidden from the order page.'}[v];
  saveItem(row,{status:v},text).then(function(ok){
    if(!ok) return;
    row.className='mi '+v;
    row.querySelectorAll('.quick button').forEach(function(x){x.setAttribute('aria-pressed',x.dataset.v===v)});
  });
});
$('newGrp').addEventListener('change',function(){$('newGrpName').hidden=this.value!=='__new'});
$('addItem').addEventListener('click',function(){
  var isNew=$('newGrp').value==='__new', grp=(isNew?$('newGrpName').value:$('newGrp').value).trim();
  var name=$('newName').value.trim(), price=Math.round(Number($('newPrice').value));
  if(!grp){$('addMsg').textContent='Type a name for the new section.';return;}
  if(!name){$('addMsg').textContent='Type the item name.';return;}
  if($('newPrice').value===''||!isFinite(price)||price<0){$('addMsg').textContent='Type a price, numbers only.';return;}
  var inGrp=menu.filter(function(x){return x.grp===grp}), maxAll=menu.reduce(function(a,x){return Math.max(a,x.sort)},0);
  var sort=inGrp.length?(inGrp.reduce(function(a,x){return Math.max(a,x.sort)},0)+1):((Math.floor(maxAll/100)+1)*100+1);
  $('addMsg').textContent='Adding…';
  sb.from('happy_tummy_menu').insert({id:'item-'+Date.now().toString(36),grp:grp,name:name,price:price,egg:$('newEgg').value||null,sort:sort}).then(function(r){
    if(r.error){$('addMsg').textContent='Not added. Try again.';return;}
    $('addMsg').textContent='Added '+name+'.'; $('newName').value=''; $('newPrice').value=''; $('newGrpName').value=''; loadMenu();
  });
});

/* ---------- money tracker ---------- */
var PAID=['confirmed','preparing','out_for_delivery','delivered'];
var PERIODS=[['today','Today'],['week','This week'],['month','This month'],['last','Last month'],['all','All time']];
var period='today', mOrders=[], mEntries=[];
var KIND={capital:'Capital',expense:'Expense',other_sale:'Other sale'};
function money(n){n=Number(n)||0;var neg=n<0;n=Math.abs(n);return (neg?'−':'')+'₱'+n.toLocaleString('en-PH',{minimumFractionDigits:(Math.round(n*100)%100)?2:0,maximumFractionDigits:2});}
function phDay(d){return new Date(d).toLocaleDateString('en-CA',{timeZone:'Asia/Manila'});}
function addDays(day,n){var d=new Date(day+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function nice(day){return new Date(day+'T00:00:00Z').toLocaleDateString('en-PH',{timeZone:'UTC',weekday:'short',month:'short',day:'numeric'});}
function rangeOf(p){
  var t=phDay(new Date()), y=+t.slice(0,4), m=+t.slice(5,7);
  var monthRange=function(yy,mm){var s=yy+'-'+String(mm).padStart(2,'0')+'-01';var e=new Date(Date.UTC(yy,mm,0)).toISOString().slice(0,10);return [s,e];};
  if(p==='today') return [t,t];
  if(p==='week'){var dow=(new Date(t+'T00:00:00Z').getUTCDay()+6)%7;var s=addDays(t,-dow);return [s,addDays(s,6)];}
  if(p==='month') return monthRange(y,m);
  if(p==='last') return m===1?monthRange(y-1,12):monthRange(y,m-1);
  return null;
}
function startMoney(){
  if(!$('periods').innerHTML){
    $('periods').innerHTML=PERIODS.map(function(f){return '<button class="chip" data-p="'+f[0]+'" aria-pressed="'+(f[0]===period)+'">'+f[1]+'</button>'}).join('');
    $('fDate').value=phDay(new Date());
  }
  loadMoney();
}
$('periods').addEventListener('click',function(e){
  var c=e.target.closest('.chip'); if(!c) return; period=c.dataset.p;
  $('periods').querySelectorAll('.chip').forEach(function(x){x.setAttribute('aria-pressed',x.dataset.p===period)}); loadMoney();
});
function loadMoney(){
  var r=rangeOf(period);
  $('periodLabel').textContent=r?(r[0]===r[1]?nice(r[0]):(nice(r[0])+' to '+nice(r[1]))):'Everything since you started';
  $('moneyMsg').textContent='Loading…';
  var oq=sb.from('happy_tummy_orders').select('created_at,status,total'), fq=sb.from('happy_tummy_finance').select('*');
  if(r){
    oq=oq.gte('created_at',r[0]+'T00:00:00+08:00').lt('created_at',addDays(r[1],1)+'T00:00:00+08:00');
    fq=fq.gte('entry_date',r[0]).lte('entry_date',r[1]);
  }
  Promise.all([oq.order('created_at',{ascending:false}).limit(5000),fq.order('entry_date',{ascending:false}).limit(5000)]).then(function(res){
    if(res[0].error||res[1].error){$('moneyMsg').textContent='Could not load. Refresh the page.';return;}
    mOrders=(res[0].data||[]).filter(function(o){return PAID.indexOf(o.status)>-1}); mEntries=res[1].data||[];
    $('moneyMsg').textContent=''; drawMoney();
  });
}
function drawMoney(){
  var byMonth=period==='all', rows={};
  var row=function(k){return rows[k]||(rows[k]={orders:0,sales:0,other:0,capital:0,expense:0})};
  var sum={orders:0,sales:0,other:0,capital:0,expense:0};
  mOrders.forEach(function(o){var k=phDay(o.created_at);if(byMonth)k=k.slice(0,7);var x=row(k);x.orders++;x.sales+=Number(o.total);sum.orders++;sum.sales+=Number(o.total);});
  mEntries.forEach(function(e){var k=byMonth?e.entry_date.slice(0,7):e.entry_date,x=row(k),a=Number(e.amount);
    if(e.kind==='other_sale'){x.other+=a;sum.other+=a;} else {x[e.kind]+=a;sum[e.kind]+=a;}});
  var income=sum.sales+sum.other-sum.capital-sum.expense;
  $('stats').innerHTML=
    '<div class="stat"><span>Paid orders</span><b>'+sum.orders+'</b><small>From the order form</small></div>'+
    '<div class="stat"><span>Sales</span><b>'+money(sum.sales+sum.other)+'</b><small>'+(sum.other?('Includes '+money(sum.other)+' other sales'):'Money collected')+'</small></div>'+
    '<div class="stat"><span>Capital</span><b>'+money(sum.capital)+'</b></div>'+
    '<div class="stat"><span>Expenses</span><b>'+money(sum.expense)+'</b></div>'+
    '<div class="stat big'+(income<0?' neg':'')+'"><span>Income</span><b>'+money(income)+'</b><small>Sales minus capital and expenses</small></div>';
  var keys=Object.keys(rows).sort().reverse();
  $('breakTitle').textContent=byMonth?'Month by month':'Day by day';
  $('breakdown').innerHTML=keys.length?('<table><thead><tr><th>'+(byMonth?'Month':'Date')+'</th><th>Orders</th><th>Sales</th><th>Costs</th><th>Income</th></tr></thead><tbody>'+keys.map(function(k){
    var x=rows[k],sales=x.sales+x.other,costs=x.capital+x.expense,inc=sales-costs;
    var label=byMonth?new Date(k+'-01T00:00:00Z').toLocaleDateString('en-PH',{timeZone:'UTC',month:'short',year:'numeric'}):new Date(k+'T00:00:00Z').toLocaleDateString('en-PH',{timeZone:'UTC',month:'short',day:'numeric'});
    return '<tr><td>'+esc(label)+'</td><td>'+x.orders+'</td><td>'+money(sales)+'</td><td>'+money(costs)+'</td><td class="'+(inc<0?'neg':'pos')+'">'+money(inc)+'</td></tr>';
  }).join('')+'</tbody></table>'):'<p class="meta">No paid orders or entries in this period.</p>';
  $('entries').innerHTML=mEntries.length?mEntries.map(function(e){
    return '<div class="ent" data-id="'+esc(e.id)+'"><div><b>'+esc(e.note)+'</b><small>'+esc(KIND[e.kind])+' · '+esc(nice(e.entry_date))+'</small></div>'+
      '<div style="display:flex;align-items:center;gap:10px"><span class="amt">'+(e.kind==='other_sale'?'+':'−')+money(e.amount).replace('−','')+'</span><button class="x" aria-label="Delete '+esc(e.note)+'">✕</button></div></div>';
  }).join(''):'<p class="meta">Nothing added for this period yet.</p>';
}
$('fAdd').addEventListener('click',function(){
  var d=$('fDate').value, kind=$('fKind').value, note=$('fNote').value.trim(), amt=Math.round(Number($('fAmount').value)*100)/100, m=$('fMsg');
  if(!d){m.textContent='Pick the date.';return;}
  if(!note){m.textContent='Type what it is for.';return;}
  if(!(amt>0)){m.textContent='Type the amount, numbers only.';return;}
  m.textContent='Adding…';
  sb.from('happy_tummy_finance').insert({entry_date:d,kind:kind,note:note,amount:amt}).then(function(r){
    if(r.error){m.textContent='Not added. Try again.';return;}
    m.textContent='Added '+KIND[kind].toLowerCase()+': '+note+', '+money(amt)+'.'; $('fNote').value=''; $('fAmount').value=''; loadMoney();
  });
});
$('entries').addEventListener('click',function(e){
  var b=e.target.closest('.x'); if(!b) return;
  var id=b.closest('.ent').dataset.id;
  if(!confirm('Delete this entry?')) return;
  b.disabled=true;
  sb.from('happy_tummy_finance').delete().eq('id',id).then(function(r){ if(r.error){b.disabled=false;alert('Could not delete. Try again.');return;} loadMoney(); });
});
})();
</script>
