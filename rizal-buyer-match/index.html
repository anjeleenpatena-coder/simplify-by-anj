<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rizal Buyer Match</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
html,body{margin:0}body{font-size:15px}[hidden]{display:none!important}img{max-width:100%}

/* Layout: sticky top bar; Pipeline = horizontal stage board; Buyer = stepper + next-step card + intake form beside matching projects. */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --surface-2:#eaeee9; --line:#d7ddd6;
  --ink:#18262b; --muted:#5b6b6f; --accent:#0d6f6a; --accent-ink:#ffffff; --accent-soft:#d6ece9;
  --sun:#c98a12; --sun-soft:#f8ecd2;
  --good:#1f8a4c; --good-soft:#dcf1e3; --warn:#b26a00; --warn-soft:#fbead0; --bad:#b4372d; --bad-soft:#f8dedb;
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1719; --surface:#162226; --surface-2:#1d2c30; --line:#2b3c41;
  --ink:#e6eeec; --muted:#97a9ac; --accent:#3cb8ad; --accent-ink:#06201e; --accent-soft:#163d3b;
  --sun:#e7ad3c; --sun-soft:#3a2e14;
  --good:#5fcf8d; --good-soft:#163527; --warn:#f0a94a; --warn-soft:#3b2c14; --bad:#f07d72; --bad-soft:#3d1f1c;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1719; --surface:#162226; --surface-2:#1d2c30; --line:#2b3c41;
  --ink:#e6eeec; --muted:#97a9ac; --accent:#3cb8ad; --accent-ink:#06201e; --accent-soft:#163d3b;
  --sun:#e7ad3c; --sun-soft:#3a2e14;
  --good:#5fcf8d; --good-soft:#163527; --warn:#f0a94a; --warn-soft:#3b2c14; --bad:#f07d72; --bad-soft:#3d1f1c;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--font-display);font-weight:700}
.brand h1{font-size:19px}
.brand small{display:block;color:var(--muted);font-size:12px}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-left:auto;max-width:100%}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sample{background:var(--sun-soft);font-size:13px}
.sample .wrap{padding-block:6px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:0}
main .wrap{padding-block:22px 64px}
.view-head{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between;margin-bottom:16px}
.view-head h2{font-size:26px}
.view-head p{margin:2px 0 0;color:var(--muted);max-width:62ch}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.plain{background:var(--surface-2);color:var(--muted)}
.pill.acc{background:var(--accent-soft);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
button.chip{font-size:13px;padding:5px 11px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);cursor:pointer}
button.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:18px}
.kpi{padding:12px 14px}
.kpi b{display:block;font-family:var(--font-display);font-size:28px;line-height:1.1;margin-top:2px}
.kpi span{color:var(--muted);font-size:12px}
@media (max-width:820px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Board */
.board-scroll{overflow-x:auto;padding-bottom:10px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:230px;gap:10px;min-width:min-content}
.col{background:var(--surface-2);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:140px}
.col h3{font-size:14px;font-family:var(--font-body);font-weight:700;display:flex;justify-content:space-between;gap:6px}
.col h3 small{color:var(--muted);font-weight:500;font-size:12px;display:block}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;width:100%}
.card:hover{border-color:var(--accent)}
.card .t{font-weight:700}
.card .s{color:var(--muted);font-size:12.5px}
.col .none{color:var(--muted);font-size:12.5px;padding:6px 2px}

/* Buyer view */
.back{margin-bottom:12px}
.bhead{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:14px}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--surface-2);border:1px solid var(--line);flex:none}
.bhead h2{font-size:24px}
.bhead .meta{color:var(--muted);font-size:14px}
.steps-scroll{overflow-x:auto;margin-bottom:14px}
.steps{display:flex;gap:0;list-style:none;margin:0;padding:0;min-width:min-content}
.steps li{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted);padding:6px 10px 6px 0;white-space:nowrap}
.steps li::after{content:"";width:16px;height:1px;background:var(--line);margin-left:4px}
.steps li:last-child::after{display:none}
.steps .dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:var(--surface-2);border:1px solid var(--line)}
.steps .done .dot{background:var(--good);color:var(--accent-ink);border-color:var(--good)}
.steps .done{color:var(--ink)}
.steps .cur .dot{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.steps .cur{color:var(--ink)}
.next{background:var(--accent-soft);border-radius:var(--r);padding:16px 18px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-bottom:16px}
.next h3{font-size:19px}
.next p{margin:2px 0 0;max-width:62ch;font-size:14px}
.next .acts{display:flex;gap:8px;flex-wrap:wrap}
.bgrid{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.bgrid{grid-template-columns:minmax(0,1fr)}}
.sec{padding:16px;display:flex;flex-direction:column;gap:12px}
.sec h3{font-size:17px}
.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;min-width:0}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);width:100%;font-weight:400}
.fr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.earner{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.total{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--surface-2);border-radius:9px;padding:10px 12px;font-size:14px}
.total b{font-size:17px}
.cbs{display:flex;flex-wrap:wrap;gap:6px 14px}
.cbs label{display:flex;align-items:center;gap:6px;font-weight:500;font-size:14px}
.stack{display:flex;flex-direction:column;gap:16px}

/* Project match rows */
.pm{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.pm:last-child{border-bottom:0}
.pm.sel{background:var(--accent-soft)}
.pm .top-row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.pm .name{font-weight:700}
.pm .sub{color:var(--muted);font-size:13px}
.ck{display:flex;flex-wrap:wrap;gap:6px}
.ck span{font-size:12px;padding:2px 8px;border-radius:6px;font-weight:600}
.ck .ok{background:var(--good-soft);color:var(--good)}
.ck .no{background:var(--bad-soft);color:var(--bad)}
.ck .q{background:var(--surface-2);color:var(--muted)}
.pm .acts{display:flex;gap:6px;flex-wrap:wrap}
.toggle{padding:10px 16px;border-top:1px solid var(--line)}

/* Docs */
.docs label{display:flex;gap:8px;align-items:flex-start;font-size:14px;padding:6px 0;border-bottom:1px dashed var(--line)}
.docs label:last-child{border-bottom:0}
.prog{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--good)}

/* Projects */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.proj{padding:16px;display:flex;flex-direction:column;gap:10px}
.proj h3{font-size:18px}
.proj .loc{color:var(--muted);font-size:13px}
table.comp{width:100%;border-collapse:collapse;font-size:14px}
table.comp td{padding:5px 0;border-bottom:1px solid var(--line)}
table.comp td:last-child{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
table.comp tr.em td{font-weight:700;border-bottom:0}
.req{display:flex;justify-content:space-between;align-items:center;background:var(--sun-soft);border-radius:9px;padding:8px 12px;font-size:14px}
.req b{font-family:var(--font-mono)}
.proj .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bad-soft);padding:8px 10px;border-radius:9px;font-size:14px}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(10,20,22,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:640px;padding:20px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.modal header{display:flex;justify-content:space-between;align-items:start;gap:10px}
.modal h3{font-size:20px}
.x{border:0;background:var(--surface-2);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:18px;flex:none}
textarea.msg{min-height:260px;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg);resize:vertical;line-height:1.5;width:100%}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.fg,.fr{grid-template-columns:minmax(0,1fr)}}
.hint{color:var(--muted);font-size:12.5px;font-weight:400}
.col.ph{background:var(--sun-soft)}
.col .tag{font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.olist{display:flex;flex-direction:column}
.orow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.4fr) auto;gap:10px 16px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.orow:last-child{border-bottom:0}
@media (max-width:760px){.orow{grid-template-columns:minmax(0,1fr)}}
.orow .t{font-weight:700}
.orow .s{color:var(--muted);font-size:13px}
.orow .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:760px){.orow .acts{justify-content:flex-start}}
.ohead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:22px 0 10px}
.ohead h3{font-size:18px}
.offer{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.offer.pending{border-color:var(--sun);background:var(--sun-soft)}
.offer.accepted{border-color:var(--good);background:var(--good-soft)}
.offer .r{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.save{font-size:12px;color:var(--muted);white-space:nowrap}
.save.ok{color:var(--good)} .save.bad{color:var(--bad);font-weight:700}
body.locked .tabs, body.locked .save{display:none}
.login{max-width:380px;margin:40px auto;padding:24px;display:flex;flex-direction:column;gap:6px;align-items:stretch}
.login h2{font-size:24px}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.dl div{background:var(--surface-2);border-radius:9px;padding:9px 12px;min-width:0}
.dl b{display:block;font-size:15px;overflow-wrap:anywhere}
.note{background:var(--sun-soft);border-radius:10px;padding:12px 14px;font-size:14px}
.two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.two{grid-template-columns:minmax(0,1fr)}}
.section-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.search{margin-bottom:12px}
.search input{width:100%;max-width:520px;border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--surface)}
.crow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 16px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;width:100%;cursor:pointer}
.crow:last-child{border-bottom:0}
.crow:hover{background:var(--surface-2)}
.crow .t{font-weight:700} .crow .s{color:var(--muted);font-size:13px}
.cstat{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
@media (max-width:640px){.crow{grid-template-columns:auto minmax(0,1fr)}.cstat{grid-column:1/-1;align-items:flex-start}}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.mo{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;cursor:pointer;font-size:11px;color:var(--muted)}
.mo b{font-size:15px;color:var(--ink)}
.mo.paid{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.mo.late{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.mo.next{border-color:var(--accent);border-width:2px}
.upl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.upl select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg)}
.files{display:flex;flex-direction:column;gap:8px}
.file{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px}
.file img{width:48px;height:48px;object-fit:cover;border-radius:6px}
.ficon{width:48px;height:48px;border-radius:6px;background:var(--surface-2);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted)}
.fname{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:520px){.file{grid-template-columns:48px minmax(0,1fr)}.file>div:last-child{grid-column:1/-1}}
.rlist{display:flex;flex-direction:column;gap:6px}
.rrow{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.tscroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl .r{text-align:right}
.tbl tr.tot td{font-weight:700;border-bottom:0;background:var(--surface-2)}
.mrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px}
.mrow .prog{grid-column:1/-1}
.modal.wide{max-width:760px}
fieldset{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0;min-width:0}
legend{font-size:13px;font-weight:700;padding:0 4px}
a.btn{text-decoration:none;color:inherit}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body class="locked">
<header class="top">
  <div class="wrap">
    <div class="brand"><div class="logo">RM</div><div><h1>Rizal Buyer Match</h1><small id="brand-sub">Welcome Home-Rizal PH · buyer CRM</small></div></div>
    <span class="save" id="save-status"></span>
    <nav class="tabs" id="tabs">
      <button class="tab" data-v="pipeline">Pipeline</button>
      <button class="tab" data-v="offers">Unit offers</button>
      <button class="tab" data-v="clients">Clients</button>
      <button class="tab" data-v="dash">Dashboard</button>
      <button class="tab" data-v="projects">Projects</button>
      <button class="tab" data-v="settings">Settings</button>
    </nav>
  </div>
</header>
<div class="sample" id="banner" hidden><div class="wrap"><span><b>Sample data:</b> these buyers, projects and clients are examples. Clear them when you are ready to add your real clients.</span><button class="linkbtn" data-act="clear-sample">Clear sample data</button></div></div>
<main><div class="wrap" id="view"></div></main>
<div id="modal-root"></div>
<script>
/* ---------- Your workflow: shared first steps, then Regular or 4PH ---------- */
const SHARED=["income","location","terms","budget","computation","viewing"];
const TAIL={regular:["reservation","documents","submitted"],"4ph":["documents","waiting","offer","reservation","reserved"]};
const TRACKS={regular:"Regular","4ph":"4PH"};
const INFO={
  income:{t:"Ask income",d:"Ask their basic monthly income as shown on proof of income. Solo or combined with 1–2 family members."},
  location:{t:"Ask location",d:"Ask their preferred location and if they have a specific project in mind."},
  terms:{t:"Ask terms",d:"Pre-selling (1–2 year turnover, DP in installments) or ready for occupancy (cash down payment)?"},
  budget:{t:"Ask budget",d:"Ask how much they can set aside monthly for amortization, and their down payment budget."},
  computation:{t:"Send computation",d:"Suggest one project from the list and send its sample computation."},
  viewing:{t:"Site viewing",d:"Once they understand the computation, schedule the site or unit viewing."},
  reservation:{t:"Reservation",d:{regular:"Remind them about the reservation fee to lock in the unit.","4ph":"They accepted the unit offer. Remind them to pay the reservation fee to lock it in."}},
  documents:{t:"Documents",d:{regular:"Collect all developer requirements. Tick each document as it comes in.","4ph":"Complete all requirements so the developer can include them in the unit offering."}},
  submitted:{t:"Submitted",d:"Documents complete and submitted to the developer."},
  waiting:{t:"Waiting for unit offer",d:"Documents submitted. Record the unit offer as soon as the developer sends one."},
  offer:{t:"Unit offered",d:"Send the offer to the client. Record if they accept it or want to wait for another unit."},
  reserved:{t:"Reserved",d:"Reservation paid. The unit is locked in."}

function comp(p){
  const dpTotal=p.tcp*p.dpPct/100, dpNet=Math.max(0,dpTotal-p.rf), spot=p.dpMonths<=1;
  const dpMonthly=spot?0:dpNet/p.dpMonths, loan=p.tcp-dpTotal;
  const req=+p.minIncome||Math.ceil(p.monthly/(S.settings.ratio/100));
  return {dpTotal,dpNet,dpMonthly,loan,req,cashOut:p.rf+(spot?dpNet:0),spot};
}
function checks(b,p){
  const c=comp(p), ti=income(b), out=[];
  out.push({k:"Income",s:!ti?"q":ti>=c.req?"ok":"no",d:`needs ${peso(c.req)}`});
  out.push({k:"Location",s:!b.locations.length?"q":b.locations.includes(p.town)?"ok":"no",d:p.town});
  out.push({k:"Terms",s:!b.terms?"q":b.terms==="either"||b.terms===p.term?"ok":"no",d:TERMS[p.term]});
  const needMo=Math.max(p.monthly,c.dpMonthly);
  out.push({k:"Monthly",s:!b.monthlyBudget?"q":b.monthlyBudget>=needMo?"ok":"no",d:peso(needMo)});
  out.push({k:"Cash-out",s:!b.dpBudget?"q":b.dpBudget>=c.cashOut?"ok":"no",d:peso(c.cashOut)});
  return out;
}
function ranked(b){
  return S.projects.map(p=>{const ck=checks(b,p);return{p,ck,no:ck.filter(x=>x.s==="no").length,ok:ck.filter(x=>x.s==="ok").length,incomeOk:ck[0].s!=="no"};})
    .sort((a,c)=>a.no-c.no||c.ok-a.ok||a.p.monthly-c.p.monthly);
}
function setStage(b,k){
  b.stage=k;
  if(k==="waiting"&&!b.submittedDate) b.submittedDate=todayStr();
  if(k==="reserved") b.rfPaid=true;
}
function pickProject(b,pid){
  b.project=pid; const p=P(pid);
  if(p){ b.track=p.flow||"regular"; if(!stagesOf(b).includes(b.stage)) b.stage="computation"; }
}

    ${k==="documents"?`<span class="pill warn">${docsDone(b)}/${docsFor(b).length} docs</span>`:""}
    ${k==="waiting"?`<span class="pill ${daysSince(b.submittedDate)>30?"bad":"warn"}">Waiting ${daysSince(b.submittedDate)} days</span>`:""}
    ${k==="offer"&&po?`<span class="pill acc">${esc(po.unit)}</span>`:""}
  </button>`;
}
function viewPipeline(){
  const f=ui.track;
  const cols=SHARED.map(k=>({k,tr:null})).concat(
    f!=="4ph"?TAIL.regular.map(k=>({k,tr:"regular"})):[],
    f!=="regular"?TAIL["4ph"].map(k=>({k,tr:"4ph"})):[]);
  const inCol=c=>S.buyers.filter(b=>b.stage===c.k&&(c.tr?b.track===c.tr:SHARED.includes(b.stage))&&(c.tr||f==="all"||!b.project||b.track===f));
  const n=(tr,k)=>S.buyers.filter(b=>b.track===tr&&b.stage===k).length;
  return `
  <div class="view-head"><div><h2>Pipeline</h2><p>Steps 1–6 are the same for everyone. After the site viewing, Regular and 4PH buyers follow their own steps.</p></div>
  <button class="btn primary" data-act="new-buyer">+ New inquiry</button></div>
  <div class="kpis">
    <div class="panel kpi"><div class="label">Qualifying</div><b class="num">${S.buyers.filter(b=>["income","location","terms","budget"].includes(b.stage)).length}</b><span>steps 1–4</span></div>
    <div class="panel kpi"><div class="label">Viewings set</div><b class="num">${S.buyers.filter(b=>b.stage==="viewing"&&b.viewing).length}</b><span>scheduled</span></div>
    <div class="panel kpi"><div class="label">Waiting for offer</div><b class="num">${n("4ph","waiting")}</b><span>4PH, docs submitted</span></div>
    <div class="panel kpi"><div class="label">Offer pending</div><b class="num">${n("4ph","offer")}</b><span>waiting for client answer</span></div>
    <div class="panel kpi"><div class="label">Reservation due</div><b class="num">${S.buyers.filter(b=>b.stage==="reservation").length}</b><span>to lock in the unit</span></div>
  </div>
  <div class="filters">${[["all","All buyers"],["regular","Regular"],["4ph","4PH"]].map(([k,t])=>`<button class="chip" aria-pressed="${f===k}" data-act="track" data-k="${k}">${t}</button>`).join("")}</div>
  <div class="board-scroll"><div class="board">
  ${cols.map(c=>{const list=inCol(c);return `<section class="col ${c.tr==="4ph"?"ph":""}">
    <div>${c.tr?`<div class="tag">${TRACKS[c.tr]}</div>`:`<div class="tag">All projects</div>`}<h3><span>${INFO[c.k].t}</span><span class="pill plain">${list.length}</span></h3></div>
    ${list.map(b=>card(b,c.k)).join("")||`<div class="none">No buyers here</div>`}
  </section>`}).join("")}
  </div></div>`;
}

function offerPanel(b){
  const p=P(b.project); const po=pending(b);
  return `<section class="panel sec"><h3>4PH unit offer</h3>
    <div class="fr"><label class="f">Documents submitted on<input id="i-sub" type="date" data-f="submittedDate" value="${esc(b.submittedDate)}"></label>
    <label class="f">Unit preference<input id="i-pref" data-f="unitPref" value="${esc(b.unitPref)}" placeholder="e.g. 5th floor, end unit"></label></div>
    ${b.submittedDate&&!accepted(b)?`<div class="total"><span>Waiting for unit offer</span><b class="num">${daysSince(b.submittedDate)} days</b></div>`:""}
    ${b.offers.slice().reverse().map(o=>`<div class="offer ${o.status}">
      <div class="r"><b>${esc(o.unit)}</b><span class="pill ${o.status==="accepted"?"good":o.status==="pending"?"warn":"plain"}">${o.status==="pending"?"Waiting for answer":o.status==="accepted"?"Accepted":"Declined"}</span></div>
      <div class="r"><span class="num">TCP ${peso(o.tcp)} · ${peso(o.monthly)}/mo</span><span class="hint">Offered ${fmtDate(o.date)}${o.status==="pending"&&o.replyBy?` · reply by ${fmtDate(o.replyBy)}`:""}</span></div>
      ${o.reason?`<span class="hint">Reason: ${esc(o.reason)}</span>`:""}
      ${o.status==="pending"?`<div class="acts" style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm primary" data-act="accept" data-b="${b.id}">Client accepted</button><button class="btn sm" data-act="decline" data-b="${b.id}">Declined, wait for another</button></div>`:""}
    </div>`).join("")}
    ${!po&&!accepted(b)?`<button class="btn" data-act="new-offer" data-b="${b.id}">+ Record unit offer from developer</button>`:""}
  </section>`;
}

function viewBuyer(){
  const b=B(ui.buyer); if(!b) return viewPipeline();
  const steps=stagesOf(b), idx=steps.indexOf(b.stage), info=INFO[b.stage], ti=income(b), maxAmort=ti*S.settings.ratio/100;
  const list=ranked(b), shown=ui.showAll?list:list.filter(x=>x.incomeOk), hidden=list.length-list.filter(x=>x.incomeOk).length;
  const sel=P(b.project), dl=docsFor(b), dd=docsDone(b), is4=b.track==="4ph";
  const nextK=steps[idx+1];
  let primary="";
  if(b.stage==="offer") primary=pending(b)?`<button class="btn primary" data-act="accept" data-b="${b.id}">Client accepted</button><button class="btn" data-act="decline" data-b="${b.id}">Declined, wait</button>`:`<button class="btn primary" data-act="new-offer" data-b="${b.id}">+ Record unit offer</button>`;
  else if(b.stage==="waiting") primary=`<button class="btn primary" data-act="new-offer" data-b="${b.id}">+ Record unit offer</button>`;
  else if(nextK) primary=`<button class="btn primary" data-act="advance" data-b="${b.id}">Done → ${INFO[nextK].t}</button>`;
  const showOffer=is4&&steps.indexOf(b.stage)>=steps.indexOf("documents");
  return `
  <div class="back"><button class="linkbtn" data-act="go" data-v="pipeline">← Pipeline</button></div>
  <div class="bhead"><div class="av">${initials(b.name)}</div>
    <div style="min-width:0;flex:1"><h2>${esc(b.name)} <span class="pill ${is4?"warn":"plain"}">${TRACKS[b.track]}</span></h2><div class="meta">${esc(b.phone)} · ${esc(b.channel)} · from ${esc(b.source)}</div></div>
    ${ui.confirm===b.id?`<div class="confirm">Delete ${esc(first(b))}? <button class="btn sm danger" data-act="del-buyer-yes" data-b="${b.id}">Delete</button><button class="btn sm" data-act="cancel">Cancel</button></div>`:`${(b.clientId&&C(b.clientId))||b.rfPaid||["reservation","reserved","submitted"].includes(b.stage)||(b.track==="regular"&&b.stage==="documents")?(b.clientId&&C(b.clientId)?`<button class="btn sm" data-act="open-client" data-c="${b.clientId}">Open client record</button>`:`<button class="btn sm primary" data-act="to-client" data-b="${b.id}">Add as client</button>`):""}<button class="btn sm danger" data-act="del-buyer" data-b="${b.id}">Delete buyer</button>`}
  </div>
  <div class="steps-scroll"><ol class="steps">${steps.map((k,i)=>`<li class="${i<idx?"done":i===idx?"cur":""}"><span class="dot">${i<idx?"✓":i+1}</span>${INFO[k].t}</li>`).join("")}</ol></div>
  <div class="next">
    <div><div class="label">Next step · ${idx+1} of ${steps.length}</div><h3>${info.t}</h3><p>${desc(b.stage,b.track)}${b.stage==="computation"&&!sel?" <b>Pick a project first.</b>":""}</p></div>
    <div class="acts">
      ${idx>0?`<button class="btn sm" data-act="prev" data-b="${b.id}">← Back a step</button>`:""}
      <button class="btn" data-act="msg" data-b="${b.id}">Write message</button>
      ${primary}
    </div>
  </div>
  <div class="bgrid">
    <div class="stack">
      <section class="panel sec"><h3>1 · Income</h3>
        <div class="earner"><label class="f">Buyer<input value="Buyer" disabled></label><label class="f">Basic monthly income<input id="i-inc1" type="number" min="0" data-f="inc1" value="${b.inc1||""}" placeholder="0"></label></div>
        <div class="earner"><label class="f">Family member 1<input id="i-rel2" data-f="rel2" value="${esc(b.rel2)}" placeholder="e.g. Spouse"></label><label class="f">Basic monthly income<input id="i-inc2" type="number" min="0" data-f="inc2" value="${b.inc2||""}" placeholder="0"></label></div>
        <div class="earner"><label class="f">Family member 2<input id="i-rel3" data-f="rel3" value="${esc(b.rel3)}" placeholder="e.g. Sister"></label><label class="f">Basic monthly income<input id="i-inc3" type="number" min="0" data-f="inc3" value="${b.inc3||""}" placeholder="0"></label></div>
        <div class="total"><span>${(+b.inc2||+b.inc3)?"Combined":"Solo"} income<br><b class="num">${peso(ti)}</b></span><span style="text-align:right">Can qualify up to<br><b class="num">${peso(maxAmort)}</b>/mo amortization</span></div>
      </section>
      <section class="panel sec"><h3>2 · Location</h3>
        <div class="cbs">${TOWNS.map(t=>`<label><input type="checkbox" data-f="loc" value="${t}" ${b.locations.includes(t)?"checked":""}> ${t}</label>`).join("")}</div>
        <label class="f">Specific project in mind<input id="i-pim" data-f="projectInMind" value="${esc(b.projectInMind)}" placeholder="Optional"></label>
      </section>
      <section class="panel sec"><h3>3 · Terms · 4 · Budget</h3>
        <label class="f">Preferred terms<select id="i-terms" data-f="terms"><option value="">Not asked yet</option><option value="preselling" ${b.terms==="preselling"?"selected":""}>Pre-selling (1–2 yrs turnover)</option><option value="rfo" ${b.terms==="rfo"?"selected":""}>Ready for occupancy (cash DP)</option><option value="either" ${b.terms==="either"?"selected":""}>Either is fine</option></select></label>
        <div class="fr"><label class="f">Monthly budget<input id="i-mb" type="number" min="0" data-f="monthlyBudget" value="${b.monthlyBudget||""}" placeholder="0"></label>
        <label class="f">Down payment budget<input id="i-dp" type="number" min="0" data-f="dpBudget" value="${b.dpBudget||""}" placeholder="0"></label></div>
        <label class="f">Project type<select id="i-track" data-f="track"><option value="regular" ${!is4?"selected":""}>Regular (reserve, then documents)</option><option value="4ph" ${is4?"selected":""}>4PH (documents, unit offer, then reserve)</option></select><span class="hint">Set automatically when you suggest a project.</span></label>
      </section>
      <section class="panel sec"><h3>Viewing · Reservation · Documents</h3>
        <label class="f">Site viewing schedule<input id="i-view" type="datetime-local" data-f="viewing" value="${esc(b.viewing)}"></label>
        <div class="cbs"><label><input type="checkbox" data-f="rfPaid" ${b.rfPaid?"checked":""}> Reservation fee paid${sel?` (${peso(sel.rf)})`:""}</label></div>
        <div><div style="display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:6px"><span>Developer requirements</span><span class="num">${dd}/${dl.length}</span></div><div class="prog"><i style="width:${dl.length?dd/dl.length*100:0}%"></i></div></div>
        <div class="docs">${dl.map(d=>{const i=S.settings.docs.indexOf(d);return `<label><input type="checkbox" data-f="doc" value="${i}" ${b.docs[i]?"checked":""}> ${esc(d)}</label>`}).join("")}</div>
        <label class="f">Notes<textarea id="i-notes" data-f="notes" rows="3">${esc(b.notes)}</textarea></label>
      </section>
    </div>
    <div class="stack">
      ${showOffer?offerPanel(b):""}
      <section class="panel">
        <div class="sec" style="padding-bottom:8px"><h3>Matching projects</h3>
          <p class="hint" style="margin:0">Filtered by income first. Grey = not asked yet. Pick one to use in the computation message.</p></div>
        ${shown.map(({p,ck})=>`<div class="pm ${p.id===b.project?"sel":""}">
          <div class="top-row"><div><div class="name">${esc(p.name)} ${p.flow==="4ph"?'<span class="pill warn">4PH</span>':""} ${p.id===b.project?'<span class="pill good">Suggested</span>':""}</div><div class="sub">${p.town} · ${p.type}, ${esc(p.unit)} · ${TERMS[p.term]}${p.turnover?" · "+esc(p.turnover):""}</div></div>
          <div style="text-align:right"><b class="num">${peso(p.monthly)}</b><span class="sub">/mo</span><div class="sub num">TCP ${peso(p.tcp)}</div></div></div>
          <div class="ck">${ck.map(x=>`<span class="${x.s}" title="${esc(x.d)}">${x.s==="ok"?"✓":x.s==="no"?"✗":"?"} ${x.k}${x.s==="no"?" · "+esc(x.d):""}</span>`).join("")}</div>
          <div class="acts"><button class="btn sm" data-act="comp" data-p="${p.id}" data-b="${b.id}">View computation</button>
          ${p.id===b.project?`<button class="btn sm" data-act="unpick" data-b="${b.id}">Remove pick</button>`:`<button class="btn sm primary" data-act="pick" data-p="${p.id}" data-b="${b.id}">Suggest this</button>`}</div>
        </div>`).join("")||`<div class="pm"><span class="sub">No project fits this income yet. Add a co-borrower or a lower-priced project.</span></div>`}
        ${hidden?`<div class="toggle"><button class="linkbtn" data-act="toggle-all">${ui.showAll?"Hide":"Show"} ${hidden} project${hidden>1?"s":""} not qualified by income</button></div>`:""}
      </section>
    </div>
  </div>`;
}

function viewOffers(){
  const ph=S.buyers.filter(b=>b.track==="4ph");
  const waiting=ph.filter(b=>b.stage==="waiting").sort((a,c)=>daysSince(c.submittedDate)-daysSince(a.submittedDate));
  const offered=ph.filter(b=>b.stage==="offer");
  const acc=ph.filter(b=>b.stage==="reservation");
  const docs=ph.filter(b=>b.stage==="documents");
  const history=[]; ph.forEach(b=>b.offers.filter(o=>o.status==="declined").forEach(o=>history.push({b,o})));
  const avg=waiting.length?Math.round(waiting.reduce((s,b)=>s+daysSince(b.submittedDate),0)/waiting.length):0;
  const who=b=>{const p=P(b.project);return `<div><div class="t"><button class="linkbtn" style="color:var(--ink)" data-act="open" data-b="${b.id}">${esc(b.name)}</button></div><div class="s">${esc(b.phone)} · ${esc(b.channel)}</div><div class="s">${p?esc(p.name):"No project"} · ${peso(income(b))}/mo income</div></div>`;};
  const empty=t=>`<div class="orow"><span class="s">${t}</span></div>`;
  return `
  <div class="view-head"><div><h2>Unit offers · 4PH</h2><p>Clients with complete documents, waiting for the developer’s unit offer or deciding on one. They pay the reservation only after accepting a unit.</p></div></div>
  <div class="kpis">
    <div class="panel kpi"><div class="label">Completing docs</div><b class="num">${docs.length}</b><span>not yet submitted</span></div>
    <div class="panel kpi"><div class="label">Waiting for offer</div><b class="num">${waiting.length}</b><span>docs submitted</span></div>
    <div class="panel kpi"><div class="label">Average wait</div><b class="num">${avg}</b><span>days since submission</span></div>
    <div class="panel kpi"><div class="label">Offer pending</div><b class="num">${offered.length}</b><span>waiting for client answer</span></div>
    <div class="panel kpi"><div class="label">Accepted</div><b class="num">${acc.length}</b><span>reservation due</span></div>
  </div>

  <div class="ohead"><h3>Waiting for unit offer</h3><span class="label">${waiting.length} clients · longest wait first</span></div>
  <div class="panel olist">${waiting.map(b=>`<div class="orow">${who(b)}
    <div><div class="s">Submitted ${fmtDate(b.submittedDate)||"—"}</div><div><span class="pill ${daysSince(b.submittedDate)>30?"bad":"warn"}">Waiting ${daysSince(b.submittedDate)} days</span></div><div class="s">Prefers: ${esc(b.unitPref||"No preference noted")}</div></div>
    <div class="acts"><button class="btn sm" data-act="msg-stage" data-b="${b.id}" data-k="waiting">Send update</button><button class="btn sm primary" data-act="new-offer" data-b="${b.id}">+ Record offer</button></div></div>`).join("")||empty("No one is waiting for a unit offer.")}</div>

  <div class="ohead"><h3>Offer sent · waiting for client’s answer</h3><span class="label">${offered.length} clients</span></div>
  <div class="panel olist">${offered.map(b=>{const o=pending(b);const du=o?daysUntil(o.replyBy):null;return `<div class="orow">${who(b)}
    <div>${o?`<div class="t">${esc(o.unit)}</div><div class="s num">TCP ${peso(o.tcp)} · ${peso(o.monthly)}/mo</div><div>${o.replyBy?`<span class="pill ${du<0?"bad":du<=2?"warn":"plain"}">${du<0?"Reply overdue":`Reply by ${fmtDate(o.replyBy)}`}</span>`:""}</div>`:`<span class="s">No offer recorded</span>`}
      <div class="s">Prefers: ${esc(b.unitPref||"—")}</div></div>
    <div class="acts">${o?`<button class="btn sm" data-act="msg-stage" data-b="${b.id}" data-k="offer">Send offer</button><button class="btn sm" data-act="decline" data-b="${b.id}">Declined</button><button class="btn sm primary" data-act="accept" data-b="${b.id}">Accepted</button>`:`<button class="btn sm primary" data-act="new-offer" data-b="${b.id}">+ Record offer</button>`}</div></div>`}).join("")||empty("No offers waiting for an answer.")}</div>

  <div class="ohead"><h3>Accepted · collect reservation</h3><span class="label">${acc.length} clients</span></div>
  <div class="panel olist">${acc.map(b=>{const o=accepted(b),p=P(b.project);return `<div class="orow">${who(b)}
    <div><div class="t">${o?esc(o.unit):"—"}</div><div class="s">Reservation fee: <b class="num">${p?peso(p.rf):"—"}</b></div><div class="s">Accepted ${o?fmtDate(o.date):""}</div></div>
    <div class="acts"><button class="btn sm" data-act="msg-stage" data-b="${b.id}" data-k="reservation">Send reminder</button><button class="btn sm primary" data-act="paid" data-b="${b.id}">Reservation paid</button></div></div>`}).join("")||empty("No accepted offers waiting for reservation.")}</div>

  ${history.length?`<div class="ohead"><h3>Declined offers</h3><span class="label">history</span></div>
  <div class="panel olist">${history.map(({b,o})=>`<div class="orow"><div><div class="t">${esc(b.name)}</div><div class="s">${esc(P(b.project)?.name||"")}</div></div><div><div>${esc(o.unit)}</div><div class="s">Offered ${fmtDate(o.date)} · ${esc(o.reason||"")}</div></div><div></div></div>`).join("")}</div>`:""}`;
}

function viewProjects(){
  return `
  <div class="view-head"><div><h2>Projects</h2><p>Enter each project from the developer’s computation sheet. Mark 4PH projects so buyers follow the unit-offer steps.</p></div>
  <button class="btn primary" data-act="add-proj">+ Add project</button></div>
  <div class="grid">${S.projects.map(p=>{const c=comp(p);return `<article class="panel proj">
    <div><div style="display:flex;justify-content:space-between;gap:8px;align-items:start"><h3>${esc(p.name)}</h3><span style="display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end">${p.flow==="4ph"?'<span class="pill warn">4PH</span>':""}<span class="pill ${p.term==="rfo"?"good":"acc"}">${p.term==="rfo"?"RFO":"Pre-selling"}</span></span></div>

    <div class="req"><span>Min. gross income</span><b>${peso(c.req)}</b></div>

    `<div class="acts"><button class="btn sm" data-act="edit-proj" data-p="${p.id}">Edit</button><button class="btn sm" data-act="comp" data-p="${p.id}">Copy computation</button><button class="btn sm danger" data-act="del-proj" data-p="${p.id}">Delete</button></div>`}
  </article>`}).join("")}</div>`;
}

  <form id="f-settings" class="panel sec" style="max-width:640px">
    <div class="fr"><label class="f">Your name in messages<input id="s-agent" name="agent" value="${esc(s.agent)}"></label>
    <label class="f">Page / brand name<input id="s-page" name="page" value="${esc(s.page)}"></label></div>

    <label class="f">Agent code<input id="s-ac" name="agentCode" value="${esc(s.agentCode||"")}"></label></div>
    <label class="f">Broker / realty<input id="s-br" name="broker" value="${esc(s.broker||"")}"></label>
    <div class="fr"><label class="f">Commission %<input id="s-cp" name="commPct" type="number" min="0" step="0.01" value="${s.commPct??3}"></label>
    <label class="f">Tax %<input id="s-tp" name="taxPct" type="number" min="0" step="0.01" value="${s.taxPct??5}"></label></div>
    <div class="actions" style="justify-content:flex-start"><button class="btn primary" type="submit">Save settings</button></div>
  </form>
  <section class="panel sec" style="max-width:640px;margin-top:16px"><h3>Account and data</h3>
    <p class="hint" style="margin:0">Signed in as <b>${esc(window.USER_EMAIL||"")}</b>. Your data is saved online and only your account can see it.</p>
    <div class="actions" style="justify-content:flex-start">
      <button class="btn" data-act="export">Download backup (JSON)</button>
      <button class="btn" data-act="signout">Sign out</button>

    `<div class="actions" style="justify-content:flex-start"><button class="btn danger" data-act="wipe">Start fresh (clear all data)</button>${S.sample?"":`<button class="btn" data-act="load-sample">Load sample data</button>`}</div>`}

}

/* ---------- Modals ---------- */
function closeModal(){$("#modal-root").innerHTML="";}
function modal(inner){$("#modal-root").innerHTML=`<div class="overlay" data-act="close-bg">${inner}</div>`;}
let MSG={};
function openMsg(bid,stageKey){
  const b=B(bid); stageKey=stageKey||b.stage;
  const best=ranked(b)[0];
  const p=P(b.project)||(best&&best.no===0?best.p:null);
  MSG=messages(stageKey,b,p); const keys=Object.keys(MSG);
  modal(`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
    <header><div><div class="label">Message for ${esc(b.name)} · ${esc(b.channel)}</div><h3 id="mt">${INFO[stageKey].t}</h3></div><button class="x" data-act="close" aria-label="Close">×</button></header>
    <label class="f">Step<select id="m-stage">${stagesOf(b).map(k=>`<option value="${k}" ${k===stageKey?"selected":""}>${INFO[k].t}</option>`).join("")}</select></label>
    <div class="chips" id="variants">${keys.map((k,i)=>`<button class="chip" aria-pressed="${i===0}" data-act="variant" data-k="${k}">${k}</button>`).join("")}</div>
    <textarea class="msg" id="msg-text" aria-label="Message text">${esc(MSG[keys[0]])}</textarea>
    <div class="actions"><button class="btn" data-act="close">Close</button><button class="btn primary" data-act="copy">Copy message</button></div>
  </div>`);
  $("#m-stage").addEventListener("change",e=>openMsg(bid,e.target.value));
}
function openComp(pid,bid){
  const p=P(pid), b=bid?B(bid):null;
  const txt=b?messages("computation",b,p).Friendly:compText(p);
  MSG={x:txt};
  modal(`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="ct">
    <header><div><div class="label">${b?"For "+esc(b.name):"Sample computation"}</div><h3 id="ct">${esc(p.name)}</h3></div><button class="x" data-act="close" aria-label="Close">×</button></header>
    <textarea class="msg" id="msg-text" aria-label="Computation text">${esc(txt)}</textarea>
    <div class="actions"><button class="btn" data-act="close">Close</button>${b&&b.project!==p.id?`<button class="btn" data-act="pick" data-p="${p.id}" data-b="${b.id}">Suggest this project</button>`:""}<button class="btn primary" data-act="copy">Copy</button></div>
  </div>`);
}
function openOffer(bid){
  const b=B(bid), p=P(b.project);
  modal(`<form class="modal" id="f-offer" data-b="${b.id}" role="dialog" aria-modal="true" aria-labelledby="ot">
    <header><div><div class="label">${esc(b.name)} · ${p?esc(p.name):""}</div><h3 id="ot">Record unit offer</h3></div><button type="button" class="x" data-act="close" aria-label="Close">×</button></header>
    <p class="hint" style="margin:0">Client prefers: ${esc(b.unitPref||"no preference noted")}</p>
    <div class="fg">
      <label class="f">Offered unit<input id="o-unit" name="unit" required placeholder="Bldg A · 6F-09"></label>
      <label class="f">Offer date<input id="o-date" name="date" type="date" value="${todayStr()}" required></label>
      <label class="f">TCP<input id="o-tcp" name="tcp" type="number" min="0" value="${p?p.tcp:""}" required></label>
      <label class="f">Monthly amortization<input id="o-mo" name="monthly" type="number" min="0" value="${p?p.monthly:""}" required></label>
      <label class="f">Client must reply by<input id="o-reply" name="replyBy" type="date" value="${todayStr(5)}"></label>
    </div>
    <div class="actions"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn primary" type="submit">Save offer</button></div>
  </form>`);
  $("#o-unit").focus();
}
function openDecline(bid){
  const b=B(bid), o=pending(b);
  modal(`<form class="modal" id="f-decline" data-b="${b.id}" role="dialog" aria-modal="true" aria-labelledby="dt">
    <header><div><div class="label">${esc(b.name)}</div><h3 id="dt">Client declined ${o?esc(o.unit):"the offer"}</h3></div><button type="button" class="x" data-act="close" aria-label="Close">×</button></header>
    <label class="f">Reason<select id="d-reason" name="reason">${DECLINE.map(r=>`<option>${r}</option>`).join("")}</select></label>
    <label class="f">Update unit preference<input id="d-pref" name="pref" value="${esc(b.unitPref)}" placeholder="What unit would they accept?"></label>
    <p class="hint" style="margin:0">${esc(first(b))} goes back to “Waiting for unit offer”. The declined offer stays in their history.</p>
    <div class="actions"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn primary" type="submit">Save</button></div>
  </form>`);
}

    <div class="fg">
      <label class="f">Full name<input id="n-name" name="name" required placeholder="Juan Dela Cruz"></label>
      <label class="f">Mobile / account<input id="n-phone" name="phone" placeholder="0917 123 4567"></label>
      <label class="f">Chat channel<select id="n-ch" name="channel"><option>Messenger</option><option>Viber</option><option>WhatsApp</option><option>TikTok</option><option>SMS</option></select></label>

      <label class="f">Terms<select id="p-term" name="term"><option value="preselling" ${p.term==="preselling"?"selected":""}>Pre-selling</option><option value="rfo" ${p.term==="rfo"?"selected":""}>Ready for occupancy</option></select></label>
      <label class="f">Turnover (pre-selling)<input id="p-turn" name="turnover" value="${esc(p.turnover)}" placeholder="Dec 2027"></label>
      <label class="f">Total contract price<input id="p-tcp" name="tcp" type="number" min="0" required value="${p.tcp}"></label>
      <label class="f">Reservation fee<input id="p-rf" name="rf" type="number" min="0" required value="${p.rf}"></label>
      <label class="f">Downpayment %<input id="p-dp" name="dpPct" type="number" min="0" max="100" step="0.5" required value="${p.dpPct}"></label>
      <label class="f">DP payable in (months)<input id="p-dpm" name="dpMonths" type="number" min="1" required value="${p.dpMonths}"><span class="hint">Use 1 for cash / spot DP</span></label>

      <label class="f">Loan term (years)<input id="p-yrs" name="years" type="number" min="1" max="30" required value="${p.years}"></label>
      <label class="f">Monthly amortization<input id="p-mo" name="monthly" type="number" min="0" required value="${p.monthly}"><span class="hint">Copy from the developer’s sheet</span></label>
      <label class="f">Min. income (optional)<input id="p-min" name="minIncome" type="number" min="0" value="${p.minIncome||""}"><span class="hint">Leave blank to compute it</span></label>
    </div>
    <div class="actions"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn primary" type="submit">Save project</button></div>
  </form>`);

function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2400);}
function rerender(){const y=window.scrollY;render();window.scrollTo({top:y});}

/* ---------- Events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]"); if(!t) return;
  const a=t.dataset.act; if(a==="close-bg"&&e.target!==t) return;
  const b=t.dataset.b?B(t.dataset.b):null;
  switch(a){
    case "go": setView(t.dataset.v); break;
    case "open": setView("buyer",{buyer:t.dataset.b}); break;
    case "track": ui.track=t.dataset.k; render(); break;
    case "new-buyer": openNewBuyer(); break;
    case "advance": {const s=stagesOf(b);setStage(b,s[Math.min(s.length-1,s.indexOf(b.stage)+1)]);save();rerender();toast(`Moved to: ${INFO[b.stage].t}`);break;}
    case "prev": {const s=stagesOf(b);b.stage=s[Math.max(0,s.indexOf(b.stage)-1)];save();rerender();break;}
    case "msg": openMsg(b.id); break;
    case "msg-stage": openMsg(b.id,t.dataset.k); break;
    case "comp": openComp(t.dataset.p,t.dataset.b); break;
    case "pick": pickProject(b,t.dataset.p); save(); closeModal(); rerender(); toast(`${P(b.project).name} suggested${b.track==="4ph"?" · 4PH steps":""}`); break;
    case "unpick": b.project=""; save(); rerender(); break;
    case "toggle-all": ui.showAll=!ui.showAll; rerender(); break;
    case "new-offer": openOffer(b.id); break;
    case "accept": {const o=pending(b); if(o){o.status="accepted";} setStage(b,"reservation"); save(); rerender(); toast(`${first(b)} accepted. Next: reservation fee.`); break;}
    case "decline": openDecline(b.id); break;
    case "paid": setStage(b,"reserved"); save(); rerender(); toast(`${first(b)} is reserved`); break;
    case "del-buyer": case "del-proj": ui.confirm=t.dataset.b||t.dataset.p; rerender(); break;
    case "cancel": ui.confirm=null; rerender(); break;
    case "del-buyer-yes": S.buyers=S.buyers.filter(x=>x.id!==t.dataset.b); save(); setView("pipeline"); toast("Buyer deleted"); break;
    case "del-proj-yes": S.projects=S.projects.filter(x=>x.id!==t.dataset.p); S.buyers.forEach(x=>{if(x.project===t.dataset.p)x.project="";}); save(); ui.confirm=null; rerender(); toast("Project deleted"); break;
    case "add-proj": openProj(); break;
    case "edit-proj": openProj(t.dataset.p); break;
    case "close": case "close-bg": closeModal(); break;
    case "variant": document.querySelectorAll("#variants .chip").forEach(c=>c.setAttribute("aria-pressed",c===t)); $("#msg-text").value=MSG[t.dataset.k]||""; break;
    case "copy": {
      const ta=$("#msg-text"),txt=ta.value;
      const fb=()=>{ta.focus();ta.select();toast("Text selected. Use your phone or keyboard copy.");};
      try{navigator.clipboard.writeText(txt).then(()=>toast("Copied. Paste it in Messenger, Viber or WhatsApp."),fb);}catch(_){fb();}
      break;}
  }
});
/* Inline buyer edits save on change */
document.addEventListener("change",e=>{
  const el=e.target; const f=el.dataset&&el.dataset.f; if(!f||ui.view!=="buyer") return;
  const b=B(ui.buyer); if(!b) return;
  if(f==="loc") b.locations=[...document.querySelectorAll('[data-f="loc"]:checked')].map(x=>x.value);
  else if(f==="doc") b.docs[el.value]=el.checked;
  else if(f==="rfPaid") b.rfPaid=el.checked;
  else if(["inc1","inc2","inc3","monthlyBudget","dpBudget"].includes(f)) b[f]=+el.value||0;
  else if(f==="track"){ b.track=el.value; if(!stagesOf(b).includes(b.stage)) b.stage="viewing"; }
  else b[f]=el.value;
  save(); rerender();
});
document.addEventListener("submit",e=>{
  e.preventDefault(); const f=e.target, fd=new FormData(f);
  if(f.id==="f-buyer"){
    const id="B"+Date.now();
    S.buyers.unshift({...JSON.parse(JSON.stringify(blank)),id,name:fd.get("name").trim(),phone:fd.get("phone")||"—",channel:fd.get("channel"),source:fd.get("source"),stage:"income",notes:fd.get("notes")||""});
    save(); closeModal(); setView("buyer",{buyer:id}); toast("Saved. Send the first message to ask their income.");
  } else if(f.id==="f-offer"){
    const b=B(f.dataset.b);
    b.offers.push({id:"O"+Date.now(),unit:fd.get("unit").trim(),tcp:+fd.get("tcp")||0,monthly:+fd.get("monthly")||0,date:fd.get("date"),replyBy:fd.get("replyBy"),status:"pending"});
    if(!b.submittedDate) b.submittedDate=fd.get("date");
    b.stage="offer"; save(); closeModal(); rerender(); toast("Offer saved. Send it to the client next.");
  } else if(f.id==="f-decline"){
    const b=B(f.dataset.b), o=pending(b);
    if(o){o.status="declined";o.reason=fd.get("reason");}
    b.unitPref=fd.get("pref"); b.stage="waiting"; save(); closeModal(); rerender(); toast(`${first(b)} is back to waiting for a unit offer`);
  } else if(f.id==="f-proj"){
    const num=k=>+fd.get(k)||0;
    const data={name:fd.get("name").trim(),developer:fd.get("developer"),flow:fd.get("flow"),town:fd.get("town"),type:fd.get("type"),unit:fd.get("unit"),term:fd.get("term"),turnover:fd.get("turnover"),tcp:num("tcp"),rf:num("rf"),dpPct:num("dpPct"),dpMonths:Math.max(1,num("dpMonths")),financing:fd.get("financing"),years:num("years"),monthly:num("monthly"),minIncome:num("minIncome")};
    if(f.dataset.id){Object.assign(P(f.dataset.id),data);} else S.projects.push({id:"P"+Date.now(),...data});
    save(); closeModal(); rerender(); toast("Project saved");
  } else if(f.id==="f-settings"){
    const oldDocs=S.settings.docs.slice();
    S.settings={...S.settings,agent:fd.get("agent").trim()||"Agent",page:fd.get("page").trim()||"",ratio:Math.min(60,Math.max(10,+fd.get("ratio")||35)),docs:fd.get("docs").split("\n").map(x=>x.trim()).filter(Boolean),
      agentName:fd.get("agentName").trim(),agentCode:fd.get("agentCode").trim(),broker:fd.get("broker").trim(),commPct:+fd.get("commPct")||0,taxPct:+fd.get("taxPct")||0};
    if(S.settings.docs.join("\n")!==oldDocs.join("\n")) S.buyers.forEach(b=>{ // keep ticks for documents still on the list
      const nd={}; Object.keys(b.docs).forEach(i=>{const j=S.settings.docs.indexOf(oldDocs[i]); if(j>=0&&b.docs[i]) nd[j]=true;}); b.docs=nd; });
    save(); render(); toast("Settings saved");
  }
});
document.getElementById("tabs").addEventListener("click",e=>{const t=e.target.closest(".tab"); if(t) setView(t.dataset.v);});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});


/* =========================================================
   CLIENTS (after reservation) · equity tracker · commission
   ========================================================= */
const METHODS=["Bank transfer","GCash","Cash"];
const FINS=["Pag-IBIG","Bank","In-house"];
const DOC_LABELS=["Valid ID","Proof of income","Reservation agreement","Buyer information sheet","Pag-IBIG form","Other"];
const C=id=>S.clients.find(c=>c.id===id);
function cm(c){
  const gross=(+c.nsp||0)*(+c.commPct||0)/100, tax=gross*(+c.taxPct||0)/100, net=gross-tax;
  const received=S.receipts.filter(r=>r.clientId===c.id).reduce((s,r)=>s+(+r.amount||0),0);
  return {gross,tax,net,received,payable:Math.max(0,net-received)};
}
function eq(c){
  const months=+c.dpMonths||0, monthly=months?(+c.dpTotal||0)/months:0, paid=Math.min(c.payments.length,months);
  return {months,monthly,paid,paidAmt:monthly*paid,balance:Math.max(0,(+c.dpTotal||0)-monthly*paid),done:months>0&&paid>=months};
}
function dueDate(c,i){ if(!c.dpStart) return ""; const d=new Date(c.dpStart+"T00:00"); d.setMonth(d.getMonth()+i); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function overdue(c){ const e=eq(c); let n=0; for(let i=e.paid;i<e.months;i++){const d=dueDate(c,i); if(d&&d<todayStr()) n++;} return n; }
const short=n=>{n=+n||0; return n>=1e6?"₱"+(n/1e6).toFixed(2)+"M":peso(n);};

/* ---------- File storage (Supabase bucket rbm-docs, private per account) ---------- */
async function fillDocs(cid){
  const box=$("#docs-list"); const c=C(cid); if(!box||!c) return;
  const files=(c.files||[]).slice().sort((a,b)=>a.date<b.date?1:-1);
  if(!files.length){ box.innerHTML=`<p class="hint" style="margin:0">No files yet. Attach IDs, forms and signed documents.</p>`; return; }
  let urls={};
  try{ const {data}=await sb.storage.from("rbm-docs").createSignedUrls(files.map(f=>f.path),3600); (data||[]).forEach(d=>{ if(d.signedUrl) urls[d.path]=d.signedUrl; }); }catch(_){}
  if(ui.view!=="client"||ui.client!==cid) return;
  box.innerHTML=files.map(f=>{ const u=urls[f.path]||""; const img=/^image\//.test(f.type);
    return `<div class="file">${img&&u?`<img src="${u}" alt="">`:`<span class="ficon">${esc((f.name.split(".").pop()||"FILE").toUpperCase().slice(0,4))}</span>`}
      <div style="min-width:0"><div class="fname">${esc(f.name)}</div><div class="hint">${esc(f.label)} · ${(f.size/1024).toFixed(0)} KB · ${fmtDate(f.date)}</div></div>
      <div style="display:flex;gap:6px">${u?`<a class="btn sm" href="${u}" target="_blank" rel="noopener">Open</a>`:""}<button class="btn sm danger" data-act="del-file" data-f="${f.id}" data-c="${cid}">Remove</button></div></div>`; }).join("");
}

/* ---------- Clients list ---------- */
function clientMatches(c,q){ if(!q) return true; q=q.toLowerCase(); return [c.name,c.project,c.developer,c.unitNo,c.unitType,c.phone,c.email,c.agentName,c.broker,c.address].some(x=>String(x||"").toLowerCase().includes(q)); }
function viewClients(){
  const q=ui.q||"";
  const list=S.clients.filter(c=>clientMatches(c,q)).sort((a,b)=>(b.rfDate||"").localeCompare(a.rfDate||""));
  return `
  <div class="view-head"><div><h2>Clients</h2><p>Reserved buyers. Track their equity payments, documents and your commission.</p></div>
  <button class="btn primary" data-act="add-client">+ Add client</button></div>
  <div class="search"><input id="q" type="search" placeholder="Search name, project, developer, unit…" value="${esc(q)}" aria-label="Search clients"></div>
  <div class="panel olist" id="client-list">${clientRows(list)}</div>`;
}
function clientRows(list){
  return list.map(c=>{const e=eq(c),k=cm(c),od=overdue(c);return `<button class="crow" data-act="open-client" data-c="${c.id}">
    <div class="av">${initials(c.name)}</div>
    <div style="min-width:0"><div class="t">${esc(c.name)}</div><div class="s">${esc(c.project)} · ${esc(c.unitNo)} · ${esc(c.unitType)}</div><div class="s">${esc(c.developer)} · Reserved ${fmtDate(c.rfDate)}</div></div>
    <div class="cstat"><span class="pill ${e.done?"good":od?"bad":"acc"}">${e.done?"Equity complete":`Equity ${e.paid}/${e.months}`}${od&&!e.done?` · ${od} overdue`:""}</span>
    <span class="s num">TCP ${short(c.tcp)}</span><span class="s">Comm. ${k.payable?`<b class="num">${peso(k.payable)}</b> to collect`:"fully paid"}</span></div>
  </button>`}).join("")||`<div class="orow"><span class="s">No clients match your search.</span></div>`;
}

document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-act]"); if(!t) return;
  const a=t.dataset.act;
  switch(a){
    case "add-client": openClient(); break;
    case "open-client": setView("client",{client:t.dataset.c}); break;
    case "edit-client": openClient(t.dataset.c); break;
    case "del-client": ui.confirm=t.dataset.c; rerender(); break;
    case "del-client-yes": S.clients=S.clients.filter(x=>x.id!==t.dataset.c); S.receipts=S.receipts.filter(r=>r.clientId!==t.dataset.c); save(); setView("clients"); toast("Client deleted"); break;
    case "add-receipt": openReceipt(t.dataset.c); break;
    case "del-receipt": S.receipts=S.receipts.filter(r=>r.id!==t.dataset.r); save(); rerender(); toast("Payment removed"); break;
    case "pay": { const c=C(t.dataset.c), i=+t.dataset.i;
      if(i<c.payments.length) c.payments=c.payments.slice(0,i); else { while(c.payments.length<=i) c.payments.push(todayStr()); }
      save(); rerender(); break; }
    case "to-client": { const b=B(t.dataset.b), p=P(b.project), ac=b.offers&&b.offers.find(o=>o.status==="accepted");
      openClient(null,{buyerId:b.id,name:b.name,phone:b.phone,project:p?p.name:"",developer:p?p.developer||"":"",unitNo:ac?ac.unit:"",unitType:p&&UNIT_TYPES.includes(p.type)?p.type:"Townhouse",financing:p?p.financing:"Pag-IBIG",tcp:ac?ac.tcp:p?p.tcp:"",nsp:ac?ac.tcp:p?p.tcp:"",rf:p?p.rf:"",dpTotal:p?Math.round((ac?ac.tcp:p.tcp)*p.dpPct/100):"",dpMonths:p?(p.dpMonths>1?p.dpMonths:1):""}); break; }
    case "view-img": modal(`<div class="modal" role="dialog" aria-modal="true" aria-label="Image preview"><header><span></span><button class="x" data-act="close" aria-label="Close">×</button></header><img src="${t.dataset.u}" alt="" style="width:100%;border-radius:10px"></div>`); break;
    case "del-file": { const c=C(t.dataset.c), f=c&&(c.files||[]).find(x=>x.id===t.dataset.f); if(!f) break;
      const {error}=await sb.storage.from("rbm-docs").remove([f.path]);
      if(error){ toast("Could not remove the file. Check your internet."); break; }
      c.files=c.files.filter(x=>x.id!==f.id); save(); toast("File removed"); fillDocs(c.id); break; }
  }
});
document.addEventListener("input",e=>{ if(e.target.id==="q"){ ui.q=e.target.value; const box=$("#client-list"); if(box) box.innerHTML=clientRows(S.clients.filter(c=>clientMatches(c,ui.q))); } });
document.addEventListener("change",async e=>{
  if(e.target.id!=="up-file") return;
  const files=[...e.target.files], cid=e.target.dataset.c, label=$("#up-label").value, c=C(cid);
  if(!c||!files.length) return;
  c.files=c.files||[]; toast(`Uploading ${files.length} file${files.length>1?"s":""}…`);
  let ok=0; for(const f of files){ if(f.size>15*1024*1024){toast(`${f.name} is over 15 MB`);continue;}

    c.files.push({id,path,name:f.name,type:f.type,size:f.size,label,date:todayStr()}); ok++; }

document.addEventListener("submit",e=>{

    let id=f.dataset.id;
    if(id) Object.assign(C(id),data); else { id="C"+Date.now(); S.clients.unshift({id,payments:[],files:[],...data}); const b=B(f.dataset.buyer); if(b){ b.clientId=id; } }
    save(); closeModal(); setView("client",{client:id}); toast("Client saved");
  } else {
    S.receipts.push({id:"R"+Date.now(),clientId:fd.get("clientId"),date:fd.get("date"),amount:+fd.get("amount")||0,method:fd.get("method"),ref:fd.get("ref"),from:fd.get("from")});
    save(); closeModal(); rerender(); toast("Commission recorded");
  }
});

  return out;
}
function setStatus(t,cls){ const el=$("#save-status"); if(el){ el.textContent=t; el.className="save "+(cls||""); } }
function cloudSave(){
  dirty=true; setStatus("Saving…");
  try{ localStorage.setItem("rbm_backup_"+UID,JSON.stringify(S)); }catch(_){}
  clearTimeout(saveTimer); saveTimer=setTimeout(flush,700);
}
async function flush(){
  if(!UID||saving) return; saving=true; dirty=false;
  const {error}=await sb.from("rbm_state").upsert({user_id:UID,data:S,updated_at:new Date().toISOString()});
  saving=false;
  if(error){ setStatus("Not saved. Check internet","bad"); dirty=true; clearTimeout(saveTimer); saveTimer=setTimeout(flush,5000); return; }
  if(dirty) return flush();
  setStatus("All changes saved","ok");
}
window.addEventListener("beforeunload",e=>{ if(dirty||saving){ e.preventDefault(); e.returnValue=""; } });

function banner(){
  const el=$("#banner"); if(!el) return;
  el.hidden=!S.sample;
}

/* ---------- Login ---------- */
function showLogin(msg){
  document.body.classList.add("locked");
  $("#view").innerHTML=`<div class="login panel">
    <div class="logo" style="width:46px;height:46px;font-size:18px">RM</div>
    <h2>Rizal Buyer Match</h2><p class="hint" style="margin:0 0 8px">Sign in to your CRM</p>
    <form id="f-login" class="stack" style="gap:10px">
      <label class="f">Email<input id="l-email" name="email" type="email" autocomplete="username" required></label>
      <label class="f">Password<input id="l-pass" name="password" type="password" autocomplete="current-password" required minlength="6"></label>
      ${msg?`<p class="hint" style="margin:0;color:var(--bad)">${esc(msg)}</p>`:""}
      <button class="btn primary" type="submit" style="justify-content:center">Sign in</button>
      <button class="btn" type="button" data-act="signup" style="justify-content:center">Create account</button>
      <button class="linkbtn" type="button" data-act="forgot">Forgot password?</button>
    </form></div>`;
}
document.addEventListener("submit",async e=>{
  if(e.target.id!=="f-login") return; e.preventDefault();
  const fd=new FormData(e.target);
  const {error}=await sb.auth.signInWithPassword({email:fd.get("email").trim(),password:fd.get("password")});
  if(error) showLogin(error.message==="Invalid login credentials"?"Wrong email or password.":error.message);
});
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-act]"); if(!t) return;
  const a=t.dataset.act;
  if(a==="signup"){ const em=$("#l-email").value.trim(), pw=$("#l-pass").value;
    if(!em||pw.length<6){ showLogin("Enter your email and a password (6+ characters), then tap Create account."); return; }
    const {error}=await sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.href.split("#")[0]}});
    showLogin(error?error.message:"Account created. Check your email to confirm, then sign in."); }
  if(a==="forgot"){ const em=$("#l-email").value.trim(); if(!em){ showLogin("Type your email first, then tap Forgot password."); return; }
    await sb.auth.resetPasswordForEmail(em,{redirectTo:location.href.split("#")[0]}); showLogin("Password reset link sent to your email."); }
  if(a==="signout"){ await flush(); await sb.auth.signOut(); location.reload(); }
  if(a==="export"){ const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}); const u=URL.createObjectURL(blob);
    const l=document.createElement("a"); l.href=u; l.download=`rizal-buyer-match-backup-${todayStr()}.json`; document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u),2000); }
  if(a==="wipe"){ ui.confirm="wipe"; render(); }
  if(a==="wipe-yes"||a==="clear-sample"){ S={settings:S.settings,projects:[],buyers:[],clients:[],receipts:[],sample:false}; ui.confirm=null; save(); banner(); setView("pipeline"); toast("All clear. Add your first project, then your first inquiry."); }
  if(a==="load-sample"){ const d=load(); S={...d,settings:S.settings,sample:true}; save(); banner(); setView("pipeline"); toast("Sample data loaded"); }
});

async function start(session){
  UID=session.user.id; window.USER_EMAIL=session.user.email;
  document.body.classList.remove("locked");
  $("#view").innerHTML=`<div class="empty" style="padding:60px;text-align:center;color:var(--muted)">Loading your CRM…</div>`;
  const {data,error}=await sb.from("rbm_state").select("data").eq("user_id",UID).maybeSingle();
  if(error){ $("#view").innerHTML=`<div class="panel sec"><h3>Could not load your data</h3><p>${esc(error.message)}</p><button class="btn primary" onclick="location.reload()">Try again</button></div>`; return; }
  if(data&&data.data&&Object.keys(data.data).length){ S=normalize(data.data); setStatus("All changes saved","ok"); }
  else { S=normalize({...load(),sample:true}); cloudSave(); }
  banner(); render();
}
let started=false;
sb.auth.onAuthStateChange((ev,session)=>{
  if(session&&!started){ started=true; start(session); }
  if(!session&&ev==="SIGNED_OUT"){ started=false; showLogin(); }
});
sb.auth.getSession().then(({data})=>{ if(!data.session) showLogin(); });

</script>
</body>
